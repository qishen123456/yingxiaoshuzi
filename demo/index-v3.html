<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>研选责任盘 · 营销智能推送系统（Demo v3 · 真实数据版）</title>
<!--
  v3 基准（0924 批次演示数据）：1053 户房屋样本、1036 个唯一脱敏号码。
  标签来源口径：shuilu_label / envir_tag / family_structure / decorate_status。
  工作区：产品标签映射、筛选推送、海报配置、定时推送、项目说明。
  注意：静态 HTML 的推送与计划为演示交互，不等同于生产环境真实发送；上线前须进行数据和 SQL 对账。
  视觉规范：内联 SVG 图标、墨钢蓝主色 #1D5A96、清晰层级与响应式布局。

-->
<style>
  /* ================================================================
     Design System v4 — "墨钢蓝 Pro"
     品牌 #1D5A96 · 中性色阶基于 Slate · 间距节奏 4px 基数
     ================================================================ */
  :root {
    /* 品牌 */
    --brand-50: #eef5fb; --brand-100: #dcebf7; --brand-200: #bcd7ef;
    --brand-400: #3f7fc0; --brand-500: #2a6cb0; --brand-600: #1d5a96; --brand-700: #174a7c;
    --grad-brand: linear-gradient(135deg, #2a6cb0 0%, #1d5a96 60%, #174a7c 100%);
    --grad-brand-v: linear-gradient(180deg, #2a6cb0 0%, #1d5a96 100%);
    /* 功能色 */
    --ok: #0e9f6e; --ok-bg: #ecfdf5; --ok-bd: #b7ebd2;
    --warn: #d97a08; --warn-bg: #fff8eb; --warn-bd: #fbdv88;
    --danger: #dc2626; --danger-bg: #fef2f2;
    /* 中性（Slate 系） */
    --ink-1: #0f1c2e; --ink-2: #3d4f66; --ink-3: #7c8ba1; --ink-4: #a8b4c4;
    --line-1: #dde4ee; --line-2: #e9edf4;
    --bg-page: #eef1f7; --bg-card: #ffffff; --bg-soft: #f6f8fb;
    /* 圆角与阴影 */
    --r-sm: 8px; --r-md: 11px; --r-lg: 16px;
    --sh-xs: 0 1px 2px rgba(15,28,46,.06);
    --sh-sm: 0 1px 2px rgba(15,28,46,.05), 0 2px 8px -2px rgba(15,28,46,.06);
    --sh-md: 0 2px 4px rgba(15,28,46,.04), 0 12px 32px -12px rgba(15,28,46,.16);
    --sh-lg: 0 4px 12px -4px rgba(15,28,46,.08), 0 24px 56px -20px rgba(15,28,46,.22);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --mono: "SF Mono", ui-monospace, "Cascadia Code", Consolas, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font); font-size: 14px; line-height: 1.55;
    color: var(--ink-1); background: var(--bg-page);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  /* 背景氛围光 */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(900px 380px at 85% -120px, rgba(29,90,150,.09), transparent 65%),
      radial-gradient(700px 300px at -10% 110%, rgba(42,108,176,.05), transparent 60%);
  }
  ::selection { background: rgba(29,90,150,.18); }
  :focus-visible { outline: 2px solid var(--brand-500); outline-offset: 2px; border-radius: 6px; }
  /* 细滚动条 */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(124,139,161,.35); border-radius: 8px; border: 2.5px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background-color: rgba(124,139,161,.55); }
  ::-webkit-scrollbar-track { background: transparent; }
  b { font-weight: 650; }
  button { font-family: inherit; }

  .app { display: flex; min-height: 100vh; position: relative; z-index: 1; }

  /* ================= Sidebar ================= */
  .sidebar {
    width: 232px; flex: 0 0 232px; height: 100vh; position: sticky; top: 0;
    display: flex; flex-direction: column;
    background: linear-gradient(175deg, #0a1a2c 0%, #0e2440 58%, #102c4c 100%);
    border-right: 1px solid rgba(255,255,255,.06);
  }
  .sidebar::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, #58a6d8, #2a6cb0 55%, rgba(42,108,176,0)); }
  .brand { padding: 22px 20px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255,255,255,.07); }
  .brand .logo {
    width: 38px; height: 38px; border-radius: 12px; color: #fff; flex: 0 0 auto;
    background: linear-gradient(135deg, #3f7fc0, #1d5a96);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 16px -4px rgba(42,108,176,.65), inset 0 1px 0 rgba(255,255,255,.30), inset 0 -1px 0 rgba(0,0,0,.15);
  }
  .brand .title { color: #fff; font-weight: 700; font-size: 15px; letter-spacing: .015em; }
  .brand .sub { color: rgba(255,255,255,.40); font-size: 11px; margin-top: 2px; letter-spacing: .02em; }
  .nav { padding: 14px 12px; flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .nav-item {
    display: flex; align-items: center; gap: 11px; padding: 10.5px 14px;
    border-radius: 10px; cursor: pointer; color: rgba(255,255,255,.58);
    font-size: 13.5px; font-weight: 500; user-select: none;
    transition: background .16s ease, color .16s ease;
  }
  .nav-item svg { opacity: .8; }
  .nav-item:hover { background: rgba(255,255,255,.07); color: #fff; }
  .nav-item.active {
    background: linear-gradient(135deg, rgba(88,166,216,.30), rgba(42,108,176,.42));
    color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 2px 8px -2px rgba(0,0,0,.25);
  }
  .nav-item.active svg { opacity: 1; }
  .sidebar-foot { margin: 0 14px 16px; padding: 12px 14px; border-radius: 12px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.07); }
  .sidebar-foot .sf-row { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; color: rgba(255,255,255,.85); }
  .sidebar-foot .sf-dot { width: 7px; height: 7px; border-radius: 50%; background: #34d399; box-shadow: 0 0 0 3px rgba(52,211,153,.18); }
  .sidebar-foot .sf-meta { margin-top: 5px; font-size: 11px; color: rgba(255,255,255,.40); line-height: 1.65; }

  /* ================= Main / Topbar ================= */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    height: 62px; padding: 0 30px; position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(255,255,255,.78); backdrop-filter: blur(14px) saturate(1.4);
    border-bottom: 1px solid var(--line-2);
  }
  .topbar .crumb { font-size: 16px; font-weight: 700; letter-spacing: -.015em; }
  .topbar .crumb .sub { font-weight: 450; color: var(--ink-3); font-size: 12px; margin-left: 10px; }
  .data-badge {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--ok-bg); color: var(--ok);
    border: 1px solid var(--ok-bd); border-radius: 999px;
    padding: 5px 13px; font-size: 12px; font-weight: 600;
    box-shadow: 0 1px 2px rgba(14,159,110,.12);
  }
  .data-badge svg { flex: 0 0 auto; }

  .content { padding: 28px 32px 48px; width: 100%; position: relative; }
  .page-head { margin-bottom: 22px; }
  .page-head h2 { margin: 0 0 8px; font-size: 22px; font-weight: 750; letter-spacing: -.02em; }
  .page-head p { margin: 0; color: var(--ink-2); font-size: 13.5px; }

  /* ================= Cards & KPI ================= */
  .card {
    background: var(--bg-card); border: 1px solid rgba(15,28,46,.065);
    border-radius: var(--r-lg); box-shadow: var(--sh-sm); padding: 22px; margin-bottom: 16px;
  }
  .card .card-title { font-weight: 700; font-size: 15px; margin-bottom: 16px; display: flex; align-items: center; gap: 9px; letter-spacing: -.01em; }
  .card .card-title .meta { margin-left: auto; font-size: 12px; color: var(--ink-3); font-weight: 450; }

  .grid-kpi { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 18px; }
  .kpi {
    display: flex; align-items: flex-start; gap: 13px;
    background: var(--bg-card); border: 1px solid rgba(15,28,46,.065);
    border-radius: var(--r-lg); padding: 18px; box-shadow: var(--sh-xs);
    transition: box-shadow .18s ease, transform .18s ease;
  }
  .kpi:hover { box-shadow: var(--sh-md); transform: translateY(-2px); }
  .kpi .k-icon {
    width: 42px; height: 42px; border-radius: 12px; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
  }
  .kpi .k-icon.blue  { background: var(--brand-50); color: var(--brand-600); }
  .kpi .k-icon.green { background: var(--ok-bg); color: var(--ok); }
  .kpi .k-icon.amber { background: var(--warn-bg); color: var(--warn); }
  .kpi .k-body { min-width: 0; }
  .kpi .k-label { color: var(--ink-2); font-size: 12.5px; font-weight: 550; }
  .kpi .k-value { font-size: 27px; font-weight: 750; margin-top: 4px; letter-spacing: -.025em; line-height: 1.1; font-feature-settings: "tnum"; }
  .kpi .k-sub { font-size: 11.5px; color: var(--ink-3); margin-top: 4px; }
  .kpi.accent { background: var(--grad-brand); border: none; box-shadow: 0 12px 28px -10px rgba(23,74,124,.55), inset 0 1px 0 rgba(255,255,255,.16); }
  .kpi.accent .k-icon { background: rgba(255,255,255,.16); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.2); }
  .kpi.accent .k-label { color: rgba(255,255,255,.78); }
  .kpi.accent .k-value { color: #fff; }
  .kpi.accent .k-sub { color: rgba(255,255,255,.60); }

  /* ================= Tables ================= */
  table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
  thead th {
    text-align: left; color: var(--ink-2); font-weight: 650; font-size: 12px;
    padding: 11px 14px; background: var(--bg-soft); white-space: nowrap;
    border-bottom: 1px solid var(--line-1);
  }
  tbody td { padding: 10px 14px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr { transition: background .12s ease; }
  tbody tr:hover td { background: #f5f9fe; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--line-2); border-radius: 14px; background: #fff; }

  /* ================= Badges & chips ================= */
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 11px; border-radius: 999px; font-size: 11.5px; font-weight: 600; border: 1px solid transparent; white-space: nowrap; letter-spacing: .01em; }
  .badge.primary { background: var(--brand-50); color: var(--brand-600); border-color: var(--brand-200); }
  .badge.success { background: var(--ok-bg); color: var(--ok); border-color: var(--ok-bd); }
  .badge.warning { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-bd); }
  .badge.neutral { background: var(--bg-soft); color: var(--ink-2); border-color: var(--line-1); }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .code { font-family: var(--mono); font-size: 12px; background: var(--bg-soft); border: 1px solid var(--line-2); border-radius: 7px; padding: 2px 8px; color: var(--ink-2); }

  .tag-pill { display: inline-block; padding: 2px 10px; background: var(--bg-soft); border: 1px solid var(--line-2); border-radius: 999px; font-size: 11.5px; color: var(--ink-2); margin: 1.5px 4px 1.5px 0; white-space: nowrap; }
  .tag-pill.matched { background: var(--brand-50); border-color: var(--brand-200); color: var(--brand-700); font-weight: 550; }

  /* ================= Buttons ================= */
  .btn {
    font-family: inherit; font-size: 13px; font-weight: 560; letter-spacing: .005em;
    border: 1px solid var(--line-1); background: #fff; color: var(--ink-1);
    border-radius: 10px; padding: 7.5px 16px; cursor: pointer;
    box-shadow: var(--sh-xs);
    transition: all .16s cubic-bezier(.4,0,.2,1);
  }
  .btn:hover { color: var(--brand-600); border-color: var(--brand-200); background: #fbfdff; box-shadow: var(--sh-sm); transform: translateY(-1px); }
  .btn:active { transform: translateY(0) scale(.985); box-shadow: none; }
  .btn.primary {
    background: var(--grad-brand-v); border-color: transparent; color: #fff;
    box-shadow: 0 5px 14px -4px rgba(23,74,124,.55), inset 0 1px 0 rgba(255,255,255,.20);
  }
  .btn.primary:hover { background: linear-gradient(180deg, #3a78bd 0%, #245f9e 100%); color: #fff; box-shadow: 0 7px 18px -4px rgba(23,74,124,.62), inset 0 1px 0 rgba(255,255,255,.20); }
  .btn.primary:active { transform: scale(.985); }
  .btn.sm { padding: 4.5px 13px; font-size: 12px; border-radius: 8px; }

  /* ================= Switch ================= */
  .switch { position: relative; width: 42px; height: 23px; display: inline-block; flex: 0 0 auto; }
  .switch input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
  .switch .track { position: absolute; inset: 0; background: #c4cfdd; border-radius: 999px; cursor: pointer; transition: background .2s ease; box-shadow: inset 0 1px 3px rgba(15,28,46,.22); }
  .switch .track::before { content: ""; position: absolute; left: 3px; top: 3px; width: 17px; height: 17px; background: #fff; border-radius: 50%; transition: transform .2s cubic-bezier(.4,0,.2,1); box-shadow: 0 1px 3px rgba(0,0,0,.28), 0 0 0 1px rgba(0,0,0,.02); }
  .switch input:checked + .track { background: var(--ok); box-shadow: inset 0 1px 3px rgba(10,80,50,.28); }
  .switch input:checked + .track::before { transform: translateX(19px); }

  /* ================= 映射矩阵 ================= */
  .matrix-table { width: 100%; table-layout: fixed; font-size: 13px; }
  .matrix-table thead th {
    padding: 13px 8px; text-align: center; vertical-align: top;
    background: linear-gradient(180deg, #f8fafd 0%, #f0f4f9 100%);
    position: sticky; top: 0; z-index: 3; border-bottom: 1px solid var(--line-1);
  }
  .matrix-table .sticky-col {
    position: sticky; left: 0; z-index: 2; text-align: left;
    width: 152px; min-width: 152px; max-width: 152px;
    background: #fbfcfe; box-shadow: 8px 0 10px -8px rgba(15,28,46,.12);
  }
  .matrix-table thead .sticky-col { z-index: 4; background: linear-gradient(180deg, #f8fafd, #f0f4f9); }
  .matrix-table .prod-col { border-left: 1px solid var(--line-2); }
  .matrix-table .prod-col.off { opacity: .5; }
  .prod-head { display: flex; align-items: center; justify-content: center; gap: 8px; }
  .prod-head .prod-name {
    font-weight: 700; font-size: 13.5px; color: var(--ink-1);
    border: 1px solid transparent; background: transparent; border-radius: 8px;
    padding: 3.5px 7px; width: 80px; min-width: 0; text-align: center;
    transition: all .14s ease;
  }
  .prod-head .prod-name:hover { border-color: var(--line-1); background: #fff; box-shadow: var(--sh-xs); }
  .prod-head .prod-name:focus { outline: none; border-color: var(--brand-500); background: #fff; box-shadow: 0 0 0 3px rgba(29,90,150,.14); }
  .prod-meta { font-size: 11.5px; color: var(--ink-3); margin-top: 6px; font-weight: 480; white-space: nowrap; font-feature-settings: "tnum"; }
  .prod-meta b { color: var(--brand-600); font-size: 13px; font-weight: 750; }
  .group-row td {
    padding: 7px 14px;
    background: linear-gradient(180deg, #e7f1fb 0%, #dce9f8 100%);
    border-top: 1px solid var(--brand-200);
    border-bottom: 1px solid var(--brand-200);
  }
  .matrix-table .group-row .group-td {
    position: sticky; left: 0; z-index: 2;
    font-size: 12.5px; color: var(--brand-700); font-weight: 750; letter-spacing: .06em;
    box-shadow: 8px 0 10px -8px rgba(15,28,46,.12);
  }
  .matrix-table .group-row .group-td::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: linear-gradient(180deg, #3f7fc0, #1d5a96);
  }
  .matrix-table .tag-name { padding: 6px 14px 6px 27px; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .matrix-table td.cell { text-align: center; padding: 6.5px 6px; border-left: 1px solid var(--line-2); }
  .matrix-table tr:hover td.cell { background: #f3f8fd; }

  .cell-btns { display: inline-flex; gap: 5px; }
  .tag-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 33px; height: 25px; font-size: 12.5px; font-weight: 700; line-height: 1;
    border-radius: 8px; cursor: pointer; padding: 0;
    border: 1px solid var(--line-1); background: #fff; color: var(--ink-4);
    box-shadow: var(--sh-xs);
    transition: all .14s cubic-bezier(.4,0,.2,1);
  }
  .tag-btn:hover { border-color: var(--brand-400); color: var(--brand-600); transform: translateY(-1px); box-shadow: var(--sh-sm); }
  .tag-btn:active { transform: scale(.94); }
  .tag-btn.mand.on { background: linear-gradient(180deg, #ffa53f 0%, #ef8113 100%); border-color: #dd7410; color: #fff; text-shadow: 0 1px 1px rgba(160,80,0,.25); box-shadow: 0 3px 9px -2px rgba(239,129,19,.6), inset 0 1px 0 rgba(255,255,255,.32); }
  .tag-btn.mand.on:hover { background: linear-gradient(180deg, #f7952c 0%, #e0750e 100%); color: #fff; }
  .tag-btn.opt.on { background: var(--grad-brand-v); border-color: #174a7c; color: #fff; text-shadow: 0 1px 1px rgba(10,45,80,.28); box-shadow: 0 3px 9px -2px rgba(29,90,150,.6), inset 0 1px 0 rgba(255,255,255,.26); }
  .tag-btn.opt.on:hover { background: linear-gradient(180deg, #3a78bd 0%, #245f9e 100%); color: #fff; }

  /* ================= 图例胶囊条 ================= */
  .cfg-legend { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-top: 3px; font-size: 12.5px; color: var(--ink-2); }
  .cfg-legend .lg-item {
    display: inline-flex; align-items: center; gap: 7px; height: 28px;
    background: #fff; border: 1px solid var(--line-2); border-radius: 999px;
    padding: 3px 14px 3px 5px; box-shadow: var(--sh-xs); font-weight: 500;
  }
  .cfg-legend .lg-item:first-child { padding-left: 14px; font-weight: 650; color: var(--ink-1); }
  .cfg-legend .lg-item.hint { color: var(--ink-3); background: transparent; border-style: dashed; box-shadow: none; padding: 3px 14px; font-weight: 450; }
  .cfg-legend .tag-btn { width: 23px; height: 19px; font-size: 11px; border-radius: 6px; cursor: default; box-shadow: none; pointer-events: none; }
  .cfg-legend .tag-btn:hover { transform: none; }

  /* ================= 表单控件 ================= */
  input[type="number"], input[type="text"], select {
    font-family: inherit; font-size: 13px; color: var(--ink-1);
    border: 1px solid var(--line-1); border-radius: 10px; padding: 7px 12px; background: #fff;
    box-shadow: var(--sh-xs);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  input[type="number"]:hover, input[type="text"]:hover, select:hover { border-color: #c2cfdf; }
  input[type="number"]:focus, input[type="text"]:focus, select:focus {
    outline: none; border-color: var(--brand-500); box-shadow: 0 0 0 3.5px rgba(29,90,150,.14);
  }
  select { cursor: pointer; }

  /* ================= 推送页 ================= */
  .toolbar { display: flex; align-items: center; gap: 11px; margin-bottom: 15px; flex-wrap: wrap; }
  .toolbar select { min-width: 142px; }
  .toolbar .search { flex: 1; min-width: 210px; }
  .toolbar input[type="text"] { width: 100%; }
  .pager { display: flex; align-items: center; gap: 12px; justify-content: center; margin-top: 16px; font-size: 12.5px; color: var(--ink-2); font-feature-settings: "tnum"; }
  .pager .btn { min-width: 70px; }
  .pager .btn:disabled { opacity: .42; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
  .chk-cell { width: 36px; text-align: center; }
  .chk-cell input[type="checkbox"] { accent-color: var(--brand-500, #1D5A96); width: 15px; height: 15px; cursor: pointer; }

  .pushed-flash {
    position: fixed; right: 28px; bottom: 28px; z-index: 100;
    display: flex; align-items: center; gap: 9px;
    background: #101f33; color: #fff; padding: 12px 19px; border-radius: 13px; font-size: 13px; font-weight: 500;
    box-shadow: var(--sh-lg), inset 0 1px 0 rgba(255,255,255,.08);
    opacity: 0; transform: translateY(12px) scale(.97); transition: all .22s cubic-bezier(.4,0,.2,1); pointer-events: none;
  }
  .pushed-flash.show { opacity: 1; transform: translateY(0) scale(1); }

  .stat-line { font-size: 12.5px; color: var(--ink-3); margin-top: 11px; }
  .filter-result { margin-left: auto; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
  .filter-result b { color: var(--brand-600); font-size: 15px; font-variant-numeric: tabular-nums; }
  .empty-tip { text-align: center; color: var(--ink-3); padding: 48px 0; font-size: 13px; }
  .modal-mask { position: fixed; inset: 0; background: rgba(15,28,46,.45); backdrop-filter: blur(3px); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 24px; }

  .modal-body { padding: 18px 22px 22px; }
  .sec-title { font-size: 13.5px; font-weight: 700; color: var(--ink-1); margin: 4px 0 10px; display: flex; align-items: center; gap: 8px; }
  .sec-title .cnt { color: var(--brand-600); font-variant-numeric: tabular-nums; }

  .push-card { border: 1px solid var(--line-1); border-radius: 12px; padding: 13px 15px; margin-bottom: 12px; background: var(--bg-card); }
  .push-meta { display: flex; gap: 8px; margin-bottom: 9px; align-items: center; }

  .push-copy .label { display: block; font-size: 11px; color: var(--ink-3); margin-bottom: 3px; }

  /* ===== 海报配置 ===== */

  .p-preview .ov-tag { position: absolute; top: 6px; left: 6px; background: rgba(255,255,255,.92); color: var(--brand-700); font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 999px; }

  .field-row input:focus { border-color: var(--brand-400); box-shadow: 0 0 0 3px rgba(29,90,150,.10); }
  .var-chips { margin: 10px 0 10px; }

  .ai-btn { align-self: flex-start; }
  .ai-note { font-size: 11.5px; color: var(--ink-3); margin-top: 8px; line-height: 1.6; }
  .tag-json { background: var(--bg-soft); border: 1px solid var(--line-1); border-radius: 8px; padding: 10px 12px; font-size: 11px; line-height: 1.55; color: var(--ink-2); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; overflow: auto; max-height: 168px; margin-top: 8px; }
  .tag-json .u { color: var(--brand-600); font-weight: 650; }
  .p-uploaded { font-size: 11.5px; color: var(--ink-3); }

  .est-item:last-child { border-right: none; }

  .est-item .t { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }
  .est-item.ok { background: var(--brand-50); }
  .est-item.ok .n { color: var(--brand-600); }

  .freq-note { font-size: 12px; color: var(--ink-3); line-height: 1.7; margin-top: 10px; }
  .freq-note b { color: var(--ink-2); }
  .plan-status { cursor: pointer; }

  /* ================= 说明块 ================= */
  .sql-note {
    background: var(--bg-soft); border: 1px dashed var(--line-1);
    border-radius: 12px; padding: 12px 16px; font-size: 12.5px; color: var(--ink-2);
    margin-top: 13px; line-height: 1.8;
  }
  .sql-note code { background: #fff; padding: 1.5px 7px; border-radius: 6px; border: 1px solid var(--line-2); font-family: var(--mono); font-size: 11.5px; color: var(--ink-1); }

  /* ================= 系统说明 ================= */
  .doc-flow { display: flex; align-items: stretch; flex-wrap: wrap; margin: 2px 0 4px; }
  .doc-node {
    flex: 1 1 0; min-width: 126px;
    background: var(--bg-card); border: 1px solid var(--line-1);
    border-radius: var(--r-md); padding: 14px 13px 12px;
    transition: box-shadow .18s ease, transform .18s ease, border-color .18s ease;
  }
  .doc-node:hover { box-shadow: var(--sh-md); transform: translateY(-2px); border-color: var(--brand-200); }
  .doc-node .dn-idx {
    width: 24px; height: 24px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center;
    font-size: 12.5px; font-weight: 700; color: #fff; background: var(--grad-brand-v);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.25);
  }
  .doc-node .dn-t { font-size: 13px; font-weight: 700; margin: 9px 0 4px; color: var(--ink-1); letter-spacing: -.005em; }
  .doc-node .dn-d { font-size: 11.5px; color: var(--ink-3); line-height: 1.55; }
  .doc-arrow { flex: 0 0 auto; width: 24px; display: flex; align-items: center; justify-content: center; color: var(--ink-4); }

  .doc-layer .dl-head { display: flex; align-items: center; gap: 11px; padding: 13px 18px; background: var(--bg-soft); border-bottom: 1px solid var(--line-1); }
  .doc-layer .dl-tag { font-size: 12px; font-weight: 700; color: #fff; padding: 3px 11px; border-radius: 999px; background: var(--grad-brand-v); white-space: nowrap; }
  .doc-layer .dl-t { font-size: 14px; font-weight: 700; letter-spacing: -.01em; }
  .doc-layer .dl-m { margin-left: auto; font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }
  .doc-mod-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--line-2); }
  .doc-mod { background: #fff; padding: 18px 20px; }
  .doc-mod .dm-head { display: flex; align-items: center; gap: 10px; margin-bottom: 11px; }
  .doc-mod .dm-ico { width: 32px; height: 32px; border-radius: 10px; background: var(--brand-50); color: var(--brand-600); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .doc-mod .dm-t { font-size: 14px; font-weight: 700; letter-spacing: -.005em; }
  .doc-mod .dm-n { margin-left: auto; font-size: 11px; color: var(--ink-4); font-weight: 600; }
  .doc-mod .dm-d { font-size: 12.5px; color: var(--ink-2); line-height: 1.68; margin-bottom: 11px; }
  .doc-kv { display: flex; flex-direction: column; gap: 6px; }
  .doc-kv .kv { display: flex; gap: 9px; align-items: baseline; font-size: 12px; line-height: 1.55; }
  .doc-kv .kv b { flex: 0 0 auto; color: var(--ink-3); font-weight: 600; min-width: 0; }
  .doc-kv .kv span { color: var(--ink-1); }
  .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .compare-col { border: 1px solid var(--line-1); border-radius: var(--r-lg); overflow: hidden; background: #fff; }
  .compare-col .cc-head { padding: 14px 18px; font-size: 13.5px; font-weight: 700; display: flex; align-items: center; gap: 9px; }
  .compare-col.before .cc-head { background: #f8fafc; color: var(--ink-2); }
  .compare-col.after .cc-head { background: var(--brand-50); color: var(--brand-700); }
  .compare-col ul { margin: 0; padding: 15px 18px 15px 34px; }
  .compare-col li { font-size: 12.5px; color: var(--ink-2); line-height: 1.7; margin-bottom: 7px; }
  .compare-col li:last-child { margin-bottom: 0; }
  .compare-col li::marker { color: var(--ink-4); }
  .compare-col.after li::marker { color: var(--brand-500); }
  .doc-bullets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .doc-bullet { display: flex; gap: 11px; padding: 14px 15px; background: var(--bg-soft); border: 1px solid var(--line-2); border-radius: var(--r-md); }
  .doc-bullet .db-ico { flex: 0 0 auto; width: 32px; height: 32px; border-radius: 10px; background: var(--brand-50); color: var(--brand-600); display: flex; align-items: center; justify-content: center; }
  .doc-bullet .db-t { font-size: 13px; font-weight: 650; color: var(--ink-1); }
  .doc-bullet .db-d { font-size: 11.5px; color: var(--ink-3); line-height: 1.55; margin-top: 3px; }
  @media (max-width: 860px) {
    .doc-mod-grid { grid-template-columns: 1fr; }
    .compare-grid { grid-template-columns: 1fr; }
    .doc-bullets { grid-template-columns: 1fr; }
    .doc-arrow { width: 100%; height: 18px; }
    .doc-arrow svg { transform: rotate(90deg); }
  }

  /* ================= 响应式 ================= */
  @media (max-width: 1280px) {
    .content { padding: 24px 22px 40px; }
    .topbar { padding: 0 22px; }
  }
  @media (max-width: 1080px) {
    .grid-kpi { grid-template-columns: repeat(2, 1fr); }
    .sidebar { width: 208px; flex-basis: 208px; }
  }
  @media (max-width: 860px) {
    /* 侧栏收成图标条 */
    .sidebar { width: 66px; flex-basis: 66px; }
    .brand { padding: 18px 0; justify-content: center; border-bottom: 1px solid rgba(255,255,255,.07); }
    .brand > div:last-child { display: none; }
    .nav { padding: 12px 8px; }
    .nav-item { justify-content: center; padding: 11px 0; }
    .nav-item span { display: none; }

  @media (max-width: 640px) {
    .grid-kpi { grid-template-columns: 1fr; }
    .content { padding: 18px 14px 32px; }
    .page-head h2 { font-size: 19px; }
    .data-badge { display: none; }
  }

  /* ===== UI refinement: cleaner hierarchy and quieter surfaces ===== */
  :root {
    --bg-page: #f4f7fb; --bg-soft: #f7f9fc;
    --line-1: #dce4ef; --line-2: #e9eef5;
    --sh-xs: 0 1px 2px rgba(16,35,62,.04);

    --sh-md: 0 8px 24px rgba(16,35,62,.09);
  }
  body::before { background: radial-gradient(900px 360px at 85% -140px, rgba(29,90,150,.055), transparent 68%); }
  .sidebar { width: 244px; flex-basis: 244px; background: #10243b; border-right: 1px solid rgba(255,255,255,.08); }
  .sidebar::before { height: 2px; background: #4c91c6; }
  .brand { padding: 24px 20px 22px; }

  .data-badge { box-shadow: none; padding: 5px 11px; }
  .content { padding: 32px clamp(20px,3vw,44px) 52px; max-width: 1840px; margin: 0 auto; }

  .page-head p { max-width: 900px; color: #62738a; line-height: 1.75; }
  .card { border-color: #e3e9f1; border-radius: 14px; box-shadow: 0 2px 8px rgba(16,35,62,.035); padding: 24px; }
  .card .card-title { margin-bottom: 18px; }
  .grid-kpi { gap: 14px; }
  .kpi { border-color: #e3e9f1; border-radius: 14px; box-shadow: none; padding: 18px; }

  .tag-btn.mand.on { background: #c96e14; border-color: #c96e14; box-shadow: none; text-shadow: none; }
  .tag-btn.opt.on { background: #1d5a96; border-color: #1d5a96; box-shadow: none; text-shadow: none; }

  .matrix-table .tag-name { background: #fff; }
  .mapping-tools { display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap; padding:17px 19px; margin:-5px 0 14px; background:#fff; border:1px solid #e3e9f1; border-radius:13px; box-shadow:0 2px 8px rgba(16,35,62,.025); }
  .mapping-tools-copy { min-width:190px; display:flex; flex-direction:column; gap:4px; }
  .mapping-tools-copy strong { font-size:13.5px; color:var(--ink-1); }
  .mapping-tools-copy small { font-size:11.5px; color:var(--ink-3); line-height:1.6; }
  .mapping-tools-copy .mt-eyebrow { font-size:10.5px; font-weight:750; color:var(--brand-600); letter-spacing:.09em; text-transform:uppercase; }
  .mapping-form { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .mapping-form label { font-size:12px; color:var(--ink-2); font-weight:600; }

  .mapping-form input { width:210px; max-width:100%; }
  .mapping-counter { color:var(--ink-3); font-size:11.5px; white-space:nowrap; }
  .map-page-head { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; }
  .map-page-head .cfg-legend { margin:0 0 2px; }
  .tag-group-count { margin-left:6px; font-size:10px; font-weight:500; color:#7690ad; letter-spacing:0; }

  .config-actions .config-buttons { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .doc-hero { position:relative; overflow:hidden; display:grid; grid-template-columns:minmax(0,1.25fr) minmax(240px,.75fr); gap:26px; align-items:center; padding:30px 32px; margin-bottom:22px; color:#fff; background:#153d63; border-radius:17px; box-shadow:0 10px 26px rgba(16,52,86,.12); }

      passed: mandHit === rule.mandatory.length && optHit >= rule.minOptionalHits,
      hitCount: mandHit + optHit,
      mandHit: mandHit, mandTotal: rule.mandatory.length,
      optHit: optHit, optTotal: rule.optional.length
    };
  }

  // 每户评估全部启用规则 → 命中结果 + 胜出规则（三级排序）
  function evalHouse(h) {
    var tags = houseTags(h);
    var hits = [];
    RULES.forEach(function (r) {
      if (!r.enabled) return;
      var e = evalRule(r, tags);
      if (e.passed) hits.push({ rule: r, eval: e });
    });
    hits.sort(function (a, b) {
      if (a.rule.manual_priority !== b.rule.manual_priority) return a.rule.manual_priority - b.rule.manual_priority;
      if (a.eval.hitCount !== b.eval.hitCount) return b.eval.hitCount - a.eval.hitCount;
      return a.rule.id - b.rule.id;
    });
    return { tags: tags, hits: hits, winner: hits.length ? hits[0] : null, all: hits.map(function (x) { return x.rule.name; }) };
  }

  /* ============ 页面 1：产品-标签映射配置（产品级搜索选择） ============ */
  var RULE_TAG_SEARCH = {};
  var TAG_BROWSER_OPEN = {};
  var TAG_CATEGORY_OPEN = {};
  var ACTIVE_RULE_ID = null;
  var TAG_EDITOR = null;
  function getRuleTagKeys() {
    return Object.keys(TAG_DICT).filter(function (key) {
      var meta = TAG_DICT[key];
      return meta && (meta.valueType === "enum" || meta.valueType === "multi_enum") &&
        Array.isArray(meta.values);
    }).sort(function (a, b) {
      var am = TAG_DICT[a], bm = TAG_DICT[b];
      return String(am.tagGroup || "").localeCompare(String(bm.tagGroup || "")) ||
        String(am.label || a).localeCompare(String(bm.label || b), "zh-CN");
    });
  }

  function renderConfig() {
    function getValues(rule,bucket) {
      var items=[];
      (rule[bucket]||[]).forEach(function(condition){
        (Array.isArray(condition.value)?condition.value:[]).forEach(function(value){items.push({tag:condition.tag,value:value});});
      });
      return items;
    }
    function selectedFor(rule,bucket,tagKey,value) {
      return (rule[bucket]||[]).some(function(condition){return condition.tag===tagKey&&Array.isArray(condition.value)&&condition.value.indexOf(value)>=0;});
    }
    function renderChips(rule,bucket,limit) {
      var items=getValues(rule,bucket);
      if(!items.length)return '<div class="rule-compare-empty">暂未配置</div>';
      var list=items.map(function(item){
        var meta=TAG_DICT[item.tag],label=meta?meta.label:item.tag;
        return '<span class="rule-compare-chip" title="'+escapeHtml(label+" · "+item.value)+'"><span class="rcc-group">'+escapeHtml(label)+'</span><span class="rcc-value">'+escapeHtml(item.value)+'</span>'+
          '<button type="button" aria-label="移除标签" data-tag-key="'+escapeHtml(item.tag)+'" data-tag-value="'+escapeHtml(item.value)+'" onclick="window._removeRuleTag('+rule.id+',\''+bucket+'\',this.dataset.tagKey,this.dataset.tagValue)">×</button></span>';
      });
      if(limit&&items.length>limit){
        var hiddenCount=items.length-limit;
        return list.slice(0,limit).join("")+'<span class="rule-compare-chip">+'+hiddenCount+' 项</span>';
      }
      return list.join("");
    }
    function renderBucket(rule,bucket,title,mark) {
      var count=getValues(rule,bucket).length;
      return '<section class="rule-compare-section"><div class="rule-compare-section-head"><div class="rule-compare-section-title"><span class="rule-compare-section-mark '+mark+'">'+(mark==="mand"?"必":"分")+'</span>'+title+'</div><span class="rule-compare-section-count">'+count+' 项</span></div>'+
        '<div class="rule-compare-tags">'+renderChips(rule,bucket,8)+'</div>'+
        '<button type="button" class="rule-compare-edit" onclick="window._openRuleTagEditor('+rule.id+',\''+bucket+'\')">＋ 编辑'+title+'</button></section>';
    }
    function renderModal() {
      if(!TAG_EDITOR)return "";
      var rule=RULES.find(function(item){return item.id===TAG_EDITOR.ruleId;});
      if(!rule){TAG_EDITOR=null;return "";}
      var bucket=TAG_EDITOR.bucket,key=rule.id+":"+bucket;
      var title=bucket==="mandatory"?"必选条件":"加分条件";
      var query=String(RULE_TAG_SEARCH[key]||"");
      var selected=getValues(rule,bucket);
      function groups() {
        var q=query.trim().toLocaleLowerCase();
        return getRuleTagKeys().map(function(tagKey){
          var meta=TAG_DICT[tagKey],values=Array.isArray(meta.values)?meta.values:[];
          var categoryKey=key+":"+tagKey,expanded=!!TAG_CATEGORY_OPEN[categoryKey];
          var matches=values.filter(function(value){return (String(meta.label)+" "+String(value)).toLocaleLowerCase().indexOf(q)>=0;});
          return '<section class="tag-modal-category" data-tag-group="'+escapeHtml(tagKey)+'"'+(q&&!matches.length?' style="display:none"':'')+'><button type="button" class="tag-modal-category-head" aria-expanded="'+(q||expanded)+'" onclick="window._toggleTagCategory('+rule.id+',\''+bucket+'\',\''+tagKey+'\')">'+
            '<strong>'+escapeHtml(meta.label)+'</strong><span class="cat-count">'+(q?matches.length+" / ":"")+values.length+' 个</span><span class="cat-arrow">›</span></button>'+
            '<div class="tag-modal-category-values'+(q||expanded?' is-open':'')+'">'+values.map(function(value){
              var idx=values.indexOf(value),checked=selectedFor(rule,bucket,tagKey,value),searchText=(String(meta.label)+" "+String(value)).toLocaleLowerCase();
              var matchesQuery=!q||searchText.indexOf(q)>=0;
              return '<label class="tag-modal-option" data-search-text="'+escapeHtml(searchText)+'"'+(matchesQuery?'':' style="display:none"')+'>'+
                '<input type="checkbox" '+(checked?'checked':'')+' onchange="window._toggleRuleTagByIndex('+rule.id+',\''+bucket+'\',\''+tagKey+'\','+idx+',this.checked)"/>'+
                '<span class="option-name">'+escapeHtml(value)+'</span><span class="option-type">'+(meta.valueType==="multi_enum"?"多值":"单值")+'</span></label>';
            }).join("")+'</div></section>';
        }).join("");
      }
      var options=groups();
      var totalValues=getRuleTagKeys().reduce(function(sum,tagKey){return sum+(TAG_DICT[tagKey].values||[]).length;},0);
      return '<div class="tag-modal-overlay" data-tag-modal="1" onclick="window._closeRuleTagEditor()"><section class="tag-modal" role="dialog" aria-modal="true" aria-label="编辑'+title+'" onclick="event.stopPropagation()">'+
        '<header class="tag-modal-head"><div class="tag-modal-heading"><div class="tag-modal-eyebrow">PRODUCT RULE / TAG SELECTOR</div><h3 class="tag-modal-title">'+escapeHtml(rule.name)+' · '+title+'</h3><div class="tag-modal-subtitle">可按类别浏览，也可以搜索类别名称或标签值。所选标签会直接显示在产品对比卡中。</div></div>'+
        '<button class="tag-modal-close" type="button" aria-label="关闭" onclick="window._closeRuleTagEditor()">×</button></header>'+
        '<div class="tag-modal-selected"><span class="tag-modal-selected-label">已选 '+selected.length+' 项</span><div class="tag-modal-selected-list">'+
        (selected.length?selected.map(function(item){var meta=TAG_DICT[item.tag];return '<span class="rule-compare-chip"><span class="rcc-group">'+escapeHtml(meta?meta.label:item.tag)+'</span><span class="rcc-value">'+escapeHtml(item.value)+'</span><button type="button" aria-label="移除" data-tag-key="'+escapeHtml(item.tag)+'" data-tag-value="'+escapeHtml(item.value)+'" onclick="window._removeRuleTag('+rule.id+',\''+bucket+'\',this.dataset.tagKey,this.dataset.tagValue)">×</button></span>';}).join(""):'<span class="tag-modal-selected-empty">还没有选择，下面按类别展开即可。</span>')+
        '</div></div><div class="tag-modal-search"><div class="tag-search-box"><span class="tag-search-icon">⌕</span><input id="tagEditorSearch" type="search" autocomplete="off" value="'+escapeHtml(query)+'" placeholder="搜索标签类别或标签值…" oninput="window._tagSearch('+rule.id+',\''+bucket+'\',this.value)"/></div></div>'+
        '<div class="tag-modal-search-summary" data-modal-summary>'+(query.trim()?'搜索匹配项':'共 '+getRuleTagKeys().length+' 个类别 · '+totalValues+' 个标签值')+'</div>'+
        '<div class="tag-modal-catalog" data-tag-editor-list="'+key+'">'+(options||'<div class="tag-modal-empty">没有匹配项。清空搜索可以浏览所有类别。</div>')+
        '</div><footer class="tag-modal-foot"><span class="tag-modal-foot-note">类别和值来自数据库字典；新增标签无需修改前端。</span><div class="tag-modal-foot-actions"><button type="button" class="btn" onclick="window._closeRuleTagEditor()">取消</button><button type="button" class="btn primary" onclick="window._closeRuleTagEditor()">完成</button></div></footer></section></div>';
    }
    if(!RULES.length)return '<div class="page-head"><h2>产品标签规则</h2><p>当前还没有产品规则。</p></div><div class="card"><button class="btn primary" onclick="window._addRule()">新增产品规则</button></div>';
    var html='<div class="page-head map-page-head"><div><h2>产品标签规则</h2><p>所有产品并排对比；需要调整时点对应的“编辑必选”或“编辑加分”，按类别浏览或搜索标签。</p></div>'+
      '<div class="cfg-legend"><span class="tag-source-status'+(TAG_SOURCE_STATUS.mode==="upstream"?" live":"")+'"><span class="dot"></span>'+(TAG_SOURCE_STATUS.mode==="upstream"?"标签表已连接":"离线预览")+'</span>'+
      '<span class="lg-item"><span class="tag-btn mand on">必</span> 必选条件</span><span class="lg-item"><span class="tag-btn opt on">分</span> 加分条件</span></div></div>'+
      '<div class="rule-compare-grid">'+RULES.map(function(rule,index){
        return '<article class="rule-compare-card'+(rule.enabled?"":" is-disabled")+'"><header class="rule-compare-head"><span class="rule-compare-index">P'+String(index+1).padStart(2,"0")+'</span>'+
          '<div class="rule-compare-head-main"><input class="rule-compare-name" aria-label="产品名称" type="text" maxlength="64" value="'+escapeHtml(rule.name)+'" onchange="window._updRule('+rule.id+',\'name\',this.value)"/>'+
          '<div class="rule-compare-meta"><span class="rule-compare-priority">优先级 '+rule.manual_priority+'</span><span>'+(rule.enabled?"参与匹配":"已停用")+'</span></div></div>'+
          '<label class="switch rule-compare-switch" title="启用或停用产品规则"><input type="checkbox" '+(rule.enabled?"checked":"")+' onchange="window._updRule('+rule.id+',\'enabled\',this.checked)"/><span class="track"></span></label></header>'+
          '<div class="rule-compare-body">'+renderBucket(rule,"mandatory","必选条件","mand")+renderBucket(rule,"optional","加分条件","opt")+'</div>'+
          '<footer class="rule-compare-foot">必选 '+(rule.mandatory||[]).length+' 组 · 加分 '+(rule.optional||[]).length+' 组</footer></article>';
      }).join("")+'</div><div class="rule-compare-actions"><span class="rule-compare-summary">规则横向对比 · 点击对应区域编辑 · 标签类别和值由数据库动态提供</span><span class="config-buttons">'+
      '<button class="btn" onclick="window._addRule()">'+icon("plus",13)+' 加产品规则</button><button class="btn" onclick="window._reset()">恢复默认</button><button class="btn primary" onclick="window._save()">'+icon("check",13)+' 保存规则</button></span></div>'+
      renderModal();
    return html;
  }

  window._openRuleTagEditor = function(ruleId,bucket) {
    TAG_EDITOR={ruleId:ruleId,bucket:bucket};
    RULE_TAG_SEARCH[ruleId+":"+bucket]="";
    TAG_CATEGORY_OPEN={};
    render();
  };
  window._closeRuleTagEditor = function() {
    TAG_EDITOR=null;
    render();
  };
  window._toggleTagCategory = function(ruleId,bucket,tagKey) {
    var key=ruleId+":"+bucket,categoryKey=key+":"+tagKey;
    var wasOpen=!!TAG_CATEGORY_OPEN[categoryKey];
    TAG_CATEGORY_OPEN[categoryKey]=!wasOpen;
    var list=document.querySelector('[data-tag-editor-list="'+key+'"]');
    if(!list)return;
    var group=list.querySelector('[data-tag-group="'+tagKey+'"]');
    if(!group)return;
    var values=group.querySelector(".tag-modal-category-values"),button=group.querySelector(".tag-modal-category-head");
    if(values)values.classList.toggle("is-open",!wasOpen||!!String(RULE_TAG_SEARCH[key]||"").trim());
    if(button)button.setAttribute("aria-expanded",!wasOpen||!!String(RULE_TAG_SEARCH[key]||"").trim()?"true":"false");
  };
  window._tagSearch = function(ruleId,bucket,query) {
    var key=ruleId+":"+bucket;
    RULE_TAG_SEARCH[key]=String(query||"");
    var list=document.querySelector('[data-tag-editor-list="'+key+'"]');
    if(!list)return;
    var q=String(query||"").trim().toLocaleLowerCase(),groups=list.querySelectorAll(".tag-modal-category"),visible=0;
    groups.forEach(function(group){
      var rows=group.querySelectorAll(".tag-modal-option"),count=0;
      rows.forEach(function(row){
        var hit=!!q&&(row.getAttribute("data-search-text")||"").indexOf(q)>=0;
        row.style.display=!q||hit?"flex":"none";
        if(hit){count++;visible++;}
      });
      group.style.display=q?(count?"block":"none"):"block";
      var values=group.querySelector(".tag-modal-category-values"),button=group.querySelector(".tag-modal-category-head"),badge=group.querySelector(".cat-count");
      if(values)values.classList.toggle("is-open",!!q||!!TAG_CATEGORY_OPEN[key+":"+group.getAttribute("data-tag-group")]);
      if(button)button.setAttribute("aria-expanded",q||TAG_CATEGORY_OPEN[key+":"+group.getAttribute("data-tag-group")]?"true":"false");
      if(badge)badge.textContent=q?(count+" 个匹配"):rows.length+" 个";
    });
    var empty=list.querySelector(".tag-modal-empty");
    if(empty)empty.remove();
    if(q&&!visible)list.insertAdjacentHTML("beforeend",'<div class="tag-modal-empty">没有找到匹配项。试试更短的关键词，或清空搜索浏览全部类别。</div>');
    var summary=document.querySelector("[data-modal-summary]");
    if(summary)summary.textContent=q?(visible+" 个匹配标签值"):"共 "+getRuleTagKeys().length+" 个类别 · "+getRuleTagKeys().reduce(function(sum,tagKey){return sum+(TAG_DICT[tagKey].values||[]).length;},0)+" 个标签值";
  };


  window._toggleRuleTagByIndex = function(ruleId,bucket,tagKey,valueIndex,checked) {
    var rule=RULES.find(function(item){return item.id===ruleId;}),meta=TAG_DICT[tagKey];
    var value=meta&&Array.isArray(meta.values)?meta.values[Number(valueIndex)]:undefined;
    if(!rule||value===undefined)return;
    var key=ruleId+":"+bucket;
    var query=RULE_TAG_SEARCH[key]||"";
    var list=document.querySelector('[data-tag-editor-list="'+key+'"]');
    var scrollTop=list?list.scrollTop:0;
    var target=bucket==="mandatory"?rule.mandatory:rule.optional;
    var other=bucket==="mandatory"?rule.optional:rule.mandatory;
    function removeValue(items,tag,val){
      items.forEach(function(condition){if(condition.tag===tag)condition.value=(condition.value||[]).filter(function(item){return item!==val;});});
      for(var i=items.length-1;i>=0;i--)if(!items[i].value||items[i].value.length===0)items.splice(i,1);
    }
    if(!checked)removeValue(target,tagKey,value);
    else{
      removeValue(other,tagKey,value);
      var condition=target.find(function(item){return item.tag===tagKey;});
      if(!condition){condition={tag:tagKey,op:meta.valueType==="enum"?"in":"contains_any",value:[]};target.push(condition);}
      if(condition.value.indexOf(value)<0)condition.value.push(value);
    }
    render();
    var nextList=document.querySelector('[data-tag-editor-list="'+key+'"]'),search=document.getElementById("tagEditorSearch");
    if(nextList)nextList.scrollTop=scrollTop;
    if(search){
      search.focus();
      try{search.setSelectionRange(query.length,query.length);}catch(e){}
    }
  };



  window._removeRuleTag = function(ruleId,bucket,tagKey,value) {
    var rule=RULES.find(function(item){return item.id===ruleId;});if(!rule)return;
    var list=bucket==="mandatory"?rule.mandatory:rule.optional;
    list.forEach(function(condition){if(condition.tag===tagKey)condition.value=(condition.value||[]).filter(function(item){return item!==value;});});
    for(var i=list.length-1;i>=0;i--)if(!list[i].value||list[i].value.length===0)list.splice(i,1);
    render();
  };

  /* ============ 页面 2：筛选推送（全量房屋台账） ============ */
  // 每户评估一次 → 全量列表（含未命中房屋），筛选在列表上做
  function allRows() {
    return HOUSES.map(function (h, hi) {
      var r = evalHouse(h);
      return { h: h, hi: hi, tags: r.tags, winner: r.winner, all: r.all, mock: MOCK.house(hi) };
    });
  }

  function getFiltered() {
    var f = pushFilter;
    return allRows().filter(function (r) {
      if (f.city !== "all" && CITY_OF_PROJECT[r.h[0]] !== f.city) return false;
      if (f.project !== "all" && PROJECTS[r.h[0]] !== f.project) return false;
      if (f.product !== "all") {
        var wn = r.winner ? r.winner.rule.name : null;
        if (f.product === "none") { if (wn) return false; }
        else if (wn !== f.product) return false;
      }
      if (f.tag !== "all") {
        var has = false;
        Object.keys(r.tags).forEach(function (k) { if (r.tags[k].indexOf(f.tag) >= 0) has = true; });
        if (!has) return false;
      }
      if (f.lead === "open" && !(r.mock.lead && r.mock.lead.open)) return false;
      if (f.lead === "no" && r.mock.lead && r.mock.lead.open) return false;
      if (f.push === "recent" && !(r.mock.pushDays !== null && r.mock.pushDays <= 30)) return false;
      if (f.push === "stale" && r.mock.pushDays !== null && r.mock.pushDays <= 30) return false;
      if (f.q) {
        var q = f.q.toLowerCase();
        if (r.h[1].toLowerCase().indexOf(q) < 0 && PHONES[r.h[5]].indexOf(q) < 0) return false;
      }
      return true;
    });
  }

  function renderPush() {
    var rows = getFiltered();

    // 全局 KPI（不受筛选影响，反映全量底账）
    var gHit = 0, gOpen = 0, gRecent = 0;
    HOUSES.forEach(function (h, hi) {
      var m = MOCK.house(hi);
      if (evalHouse(h).winner) gHit++;
      if (m.lead && m.lead.open) gOpen++;
      if (m.pushDays !== null && m.pushDays <= 30) gRecent++;
    });

    var totalPages = Math.max(1, Math.ceil(rows.length / pageSize));
    if (pushPage > totalPages) pushPage = 1;
    var pageRows = rows.slice((pushPage - 1) * pageSize, pushPage * pageSize);
    var allChecked = rows.length > 0 && rows.every(function (r) { return checked[r.hi]; });

    // 去重号码（仅命中产品的房屋有推送动作）
    var phonesInFiltered = {};
    rows.forEach(function (r) { if (r.winner) phonesInFiltered[r.h[5]] = 1; });
    var phoneCount = Object.keys(phonesInFiltered).length;

    var enabledRules = RULES.filter(function (r) { return r.enabled; });
    var tagOptions = [];
    Object.keys(TAG_DICT).forEach(function (k) {
      TAG_DICT[k].values.forEach(function (v) { tagOptions.push(v); });
    });

    function sel(key, options) {
      return '<select onchange="window._filter(\'' + key + '\',this.value)">' +
        options.map(function (o) {
          return '<option value="' + o[0] + '"' + (pushFilter[key] === o[0] ? " selected" : "") + '>' + o[1] + '</option>';
        }).join("") + '</select>';
    }
    var cityOptions = [["all", "全部城市"]].concat(CITY_OF_PROJECT.map(function (c) { return [c, c]; }));
    var projList = pushFilter.city === "all" ? PROJECTS : PROJECTS.filter(function (p, i) { return CITY_OF_PROJECT[i] === pushFilter.city; });
    var projOptions = [["all", "全部项目"]].concat(projList.map(function (p) { return [p, p]; }));
    var prodOptions = [["all", "命中产品：全部"], ["none", "未命中任何产品"]].concat(
      enabledRules.map(function (r) { return [r.name, "命中：" + r.name]; }));
    var tagSelOptions = [["all", "命中标签：全部"]].concat(tagOptions.map(function (t) { return [t, t]; }));
    var pushOptions = [["all", "推送时间：全部"], ["recent", "近一个月推送过"], ["stale", "一个月内未推送"]];
    var leadOptions = [["all", "未关闭线索：全部"], ["open", "有未关闭线索"], ["no", "无未关闭线索"]];

      '<div class="grid-kpi">' +

          '<div class="k-body"><div class="k-label">命中产品</div><div class="k-value">' + gHit + '</div><div class="k-sub">至少命中 1 条启用规则</div></div></div>' +
        '<div class="kpi">' +
          '<div class="k-icon amber"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>' +
          '<div class="k-body"><div class="k-label">未关闭线索</div><div class="k-value" style="color:var(--warn)">' + gOpen + '</div><div class="k-sub">商机状态 = 跟进中</div></div></div>' +
        '<div class="kpi">' +
          '<div class="k-icon green"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>' +
          '<div class="k-body"><div class="k-label">近一月已推送</div><div class="k-value" style="color:var(--ok)">' + gRecent + '</div><div class="k-sub">推送明细回写</div></div></div>' +
      '</div>' +

      '<div class="card">' +
        tb1 + tb2 +

        '<div class="table-wrap"><table>' +
          '<thead><tr><th class="chk-cell"><input type="checkbox"' + (allChecked ? " checked" : "") + ' onclick="window._chkAll(this.checked)"/></th><th>项目</th><th>房号</th><th>命中产品</th><th>命中标签</th><th>主叫号码</th><th>线索状态</th><th>最近推送</th><th>操作</th></tr></thead><tbody>' +
          (pageRows.length ? pageRows.map(function (r) {

            var tagPills = [];

              '<td>' + opCell + '</td>' +
            '</tr>';
          }).join("") : '<tr><td colspan="8"><div class="empty-tip">无符合条件的房屋，试试放宽筛选或重置</div></td></tr>') +
          '</tbody></table></div>' +

        '<div class="pager">' +
          '<button class="btn" ' + (pushPage <= 1 ? "disabled" : "") + ' onclick="window._page(-1)">上一页</button>' +

  /* ============ 房屋详情弹层：线索列表 + 推送记录 ============ */
  function copyFor(winner) {
    var name = winner ? winner.rule.name : "";
    if (name === "渗漏") return "【研选管家】您好，系统显示您家房屋存在渗漏报修记录，物业联合研选提供免费上门防水检测，本项目限额 30 户，回复 1 即可预约。";
    if (name === "浴改淋") return "【研选管家】您好，您家卫生间符合浴改淋改造条件，本周下单享业主专属补贴，旧卫浴免费拆运，回复 2 了解详情。";
    if (name === "刷新") return "【研选管家】您好，您家房屋装修已满 5 年，可免费预约墙面翻新评估，专业师傅上门出方案，回复 3 预约。";
    return "【研选管家】您好，物业联合研选为本项目业主提供房屋养护服务，回复 0 了解详情。";
  }

  function renderHouseModal(hi) {
    var h = HOUSES[hi];
    var r = evalHouse(h);
    var m = MOCK.house(hi);
    var ph = PHONES[h[5]];
    var isPushed = pushedPhones[h[5]] ? true : false;

    function p2(n) { return (n < 10 ? "0" : "") + n; }
    function fmtDT(daysAgo, seed) {
      var d = new Date(Date.now() - daysAgo * 86400000);
      return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()) + " " +
        p2(9 + (seed % 9)) + ":" + p2((seed * 7) % 60) + ":" + p2((seed * 13) % 60);
    }
    function fmtDay(daysAgo, seed) { return fmtDT(daysAgo, seed).slice(0, 10); }
    var leadRows = m.leads.map(function (l, li) {
      var dim = '<span style="color:var(--ink-3)">-</span>';
      return '<tr>' +
        '<td><span class="code">' + l.id + '</span></td>' +
        '<td>' + l.source + '</td>' +
        '<td>' + (l.open ? '<span class="badge warning"><span class="dot"></span>跟进中</span>' : '<span class="badge neutral">已关闭</span>') + '</td>' +
        '<td>' + l.desc + '</td>' +
        '<td>' + l.itype + '</td>' +
        '<td>' + (l.match === "-" ? dim : l.match) + '</td>' +
        '<td>' + (l.budget === null ? dim : '¥' + l.budget.toLocaleString()) + '</td>' +
        '<td>' + (l.svcDays === null ? dim : fmtDay(l.svcDays, hi * 3 + li)) + '</td>' +
        '<td><span class="code">' + ph + '</span></td>' +
        '<td>' + l.refName + '<div style="font-size:11px;color:var(--ink-3)">' + l.refPhone + '</div></td>' +
        '<td>' + l.follower + '</td>' +
        '<td>' + fmtDT(l.days, hi * 7 + li * 3) + '</td>' +
        '<td>' + (l.open ? dim : (l.closeType || '-')) + '</td>' +
      '</tr>';
    }).join("");

    var pushCards = [];
    if (isPushed) {
      pushCards.push('<div class="push-card">' +
        '<div class="push-meta"><span class="badge success"><span class="dot"></span>刚刚 · 本次演示推送</span><span class="badge primary">' + CHAN[0] + '</span><span class="badge neutral">' + (r.winner ? r.winner.rule.name : "通用") + '</span>' +
          '<span class="spacer"></span><span class="push-time">推送 <b>刚刚</b></span><span class="push-time">确认 <b style="color:var(--warn)">未确认</b></span></div>' +
        '<div class="push-copy"><span class="label">推送文案</span>' + copyFor(r.winner) + '</div>' +
        '<img class="push-thumb" src="' + POSTER + '" alt="推送海报" onclick="window._showPoster()"/>' +
        '<div class="thumb-hint">点击查看大图</div></div>');
    }
    m.pushes.forEach(function (p, pi) {
      var confCell = p.conf === null
        ? '<b style="color:var(--warn)">未确认</b>'
        : '<b>' + fmtDT(p.days - p.conf / 24, hi * 11 + pi * 5) + '</b>';
      pushCards.push('<div class="push-card">' +
        '<div class="push-meta"><span class="badge primary">' + CHAN[p.ch] + '</span><span class="badge neutral">' + (r.winner ? r.winner.rule.name : "通用") + '</span>' +
          '<span class="spacer"></span><span class="push-time">推送 <b>' + fmtDT(p.days, hi * 13 + pi * 7) + '</b></span>' +
          '<span class="push-time">确认 ' + confCell + '</span></div>' +
        '<div class="push-copy"><span class="label">推送文案</span>' + copyFor(r.winner) + '</div>' +
        '<img class="push-thumb" src="' + POSTER + '" alt="推送海报" onclick="window._showPoster()"/>' +
        '<div class="thumb-hint">点击查看大图</div></div>');
    });
    if (!pushCards.length) pushCards.push('<div class="empty-tip" style="padding:28px 0">该房屋暂无推送记录</div>');

    return '<div class="modal-mask" onclick="window._closeHouse()">' +
      '<div class="modal" onclick="event.stopPropagation()">' +
        '<div class="modal-head">' +
          '<div>' +
            '<div class="modal-title">' + h[1] + '</div>' +
            '<div class="modal-sub">' + PROJECTS[h[0]] + ' · ' + ph + ' · ' + RELATIONS[h[6]] +
              (r.all.length ? ' · 命中 ' + r.all.join(" / ") : ' · 未命中产品') + '</div>' +
          '</div>' +
          '<button class="modal-x" onclick="window._closeHouse()">✕</button>' +
        '</div>' +
        '<div class="modal-body">' +
          '<div class="sec-title">线索列表<span class="cnt">' + m.leads.length + ' 条</span><span style="font-weight:400;color:var(--ink-3);font-size:12px">口径：线索明细表（进线渠道 / 意向 / 预算 / 转介人 / 商机状态 / 闭单字段）</span></div>' +
          (m.leads.length
            ? '<div class="lead-wrap"><table class="lead-table"><thead><tr><th>线索编号</th><th>客户来源</th><th>状态</th><th>意向描述</th><th>意向类型</th><th>意向匹配</th><th>预算金额</th><th>服务时间</th><th>客户电话</th><th>转介人</th><th>跟进人</th><th>转介时间</th><th>关单类型</th></tr></thead><tbody>' + leadRows + '</tbody></table></div>'
            : '<div class="empty-tip" style="padding:24px 0">该房屋暂无线索</div>') +
          '<div class="sec-gap"></div>' +
          '<div class="sec-title">推送记录<span class="cnt">' + (m.pushes.length + (isPushed ? 1 : 0)) + ' 条</span><span style="font-weight:400;color:var(--ink-3);font-size:12px">口径：推送明细表（时间 / 文案 / 海报）</span></div>' +
          pushCards.join("") +
        '</div>' +
      '</div>' +
    '</div>';
  }

  window._openHouse = function (hi) {
    document.getElementById("modalRoot").innerHTML = renderHouseModal(hi);
  };
  window._closeHouse = function () {
    document.getElementById("modalRoot").innerHTML = "";
    window._hidePoster();
  };
  window._showPoster = function () {
    document.getElementById("posterRoot").innerHTML =
      '<div class="lightbox" onclick="window._hidePoster()"><img src="' + POSTER + '" alt="推送海报大图"/></div>';
  };
  window._hidePoster = function () {
    document.getElementById("posterRoot").innerHTML = "";
  };

  /* ============ 页面 3：海报配置（模板管理 + 标签输出） ============ */
  // 分工：本系统只管「配模板」和「开放标签」；海报文字由 AI 团队直接在模板图上合成
  function ruleTags(r) {
    var out = [];
    r.mandatory.forEach(function (c) {
      out.push({ kind: "必选", key: c.tag, label: TAG_DICT[c.tag] ? TAG_DICT[c.tag].label : c.tag, values: c.value });
    });
    r.optional.forEach(function (c) {
      out.push({ kind: "可选", key: c.tag, label: TAG_DICT[c.tag] ? TAG_DICT[c.tag].label : c.tag, values: c.value });
    });
    return out;
  }
  function tagsJson(r) {
    return JSON.stringify({
      product: r.name,
      manual_priority: r.manual_priority,
      tags: ruleTags(r).map(function (t) { return { kind: t.kind, key: t.key, label: t.label, values: t.values }; })
    }, null, 2);
  }

  function renderPoster() {
    var rules = RULES.filter(function (r) { return r.enabled; });
    var html =
      '<div class="page-head"><h2>海报配置</h2>' +
      '<p>推送链路：<b>模板 + 命中标签 → AI 自动修改图片上的标题 / 文案 → 人工抽查 → 推送</b>。本页负责：① 模板管理（约定 AI 可改区域）；② 标签开放（AI 的输入）；③ 合成策略。AI 改图由 AI 服务执行，本系统只下指令、收成品。</p></div>' +
      '<div class="poster-grid">' +
      (rules.length ? rules.map(function (r) {
        var groups = ruleTags(r);
        var pSet = posterSet(r);
        var chips = groups.map(function (g) {
          return '<div style="margin-bottom:4px"><span class="badge ' + (g.kind === "必选" ? "primary" : "neutral") + '" style="margin-right:5px">' + g.kind + '</span><span style="font-size:11.5px;color:var(--ink-3)">' + g.label + '</span></div>' +
            g.values.map(function (v) { return '<span class="tag-pill matched">' + v + '</span>'; }).join("");
        }).join("");
        return '<div class="p-card">' +
          '<div class="p-preview">' +
            '<span class="ov-tag">' + r.name + '</span>' +
            '<img src="' + POSTER + '" onclick="window._showPoster()" alt="海报模板预览"/>' +
            '<div class="p-uploaded" style="margin-top:6px">模板 1 张 · 已启用<br/><span style="color:var(--brand-600);cursor:pointer" onclick="window._showPoster()">点击放大</span></div>' +
          '</div>' +
          '<div class="p-form">' +
            '<div class="p-form-head"><span class="name">' + r.name + '</span><span class="badge primary">P' + r.manual_priority + '</span>' +
              '<button class="btn sm" style="margin-left:auto" onclick="window._pTpl(' + r.id + ')">更换 / 上传模板</button></div>' +
            '<div class="field-row"><label>合成粒度</label><select onchange="window._pSet(' + r.id + ',\'gran\',this.value)">' +
              '<option' + (pSet.gran === 0 ? " selected" : "") + ' value="0">按房屋标签个性化（每户一版，AI 逐户改图）</option>' +
              '<option' + (pSet.gran === 1 ? " selected" : "") + ' value="1">产品级（每产品一版，固定文案）</option>' +
            '</select></div>' +
            '<div class="field-row"><label>人工抽查</label><select onchange="window._pSet(' + r.id + ',\'audit\',this.value)">' +
              '<option' + (pSet.audit === 0 ? " selected" : "") + ' value="0">抽查 10%（推荐）</option>' +
              '<option' + (pSet.audit === 1 ? " selected" : "") + ' value="1">全部审核</option>' +
              '<option' + (pSet.audit === 2 ? " selected" : "") + ' value="2">不抽查</option>' +
            '</select></div>' +
            '<div class="var-chips"><div class="lab">AI 可改区域（模板约定，AI 只动文字区）：<span class="tag-pill matched">主标题区</span><span class="tag-pill matched">副标题区</span><span class="tag-pill matched">行动语区</span>　锁定：<span class="tag-pill">二维码区</span><span class="tag-pill">品牌标</span></div></div>' +
            '<div class="var-chips"><div class="lab">该产品的标签（必选全中 + 可选加分，与「映射配置」实时同步）</div>' + chips + '</div>' +

  // 频控试算：同模式 30 天内已推 → 跳过；7 天内被其他模式推过 → 跳过
  function autoEstimate() {
    if (!Array.isArray(AUTO.projectIndexes) || AUTO.projectIndexes.length === 0) return null;
    var mode = +AUTO.mode;
    var selectedSampleKeys = AUTO.projectIndexes.map(function (i) {
      var project = SCHEDULE_CATALOG[i];
      return project ? project.city + "::" + project.projectName : "";
    });
    // HTML 内置房屋仅是演示样本；项目目录接入数据库后，命中数字仍只反映样本中可匹配的项目。
    var rows = allRows().filter(function (r) {
      var sampleKey = CITY_OF_PROJECT[r.h[0]] + "::" + PROJECTS[r.h[0]];
      if (selectedSampleKeys.indexOf(sampleKey) < 0) return false;
      if (AUTO.product !== "all") {
        if (AUTO.product === "none") return false;
        if (!r.winner || r.winner.rule.name !== AUTO.product) return false;
      } else if (!r.winner) return false;
      return true;
    });
    var skipSame = 0, skipCross = 0, ph = {};
    rows.forEach(function (r) {
      var m = r.mock, blocked = false;
      if (m.pushDays !== null) {
        if (m.pushDays <= 30 && m.lastMode === mode) { skipSame++; blocked = true; }
        else if (m.pushDays <= 7 && m.lastMode !== mode) { skipCross++; blocked = true; }
      }
      if (!blocked) ph[r.h[5]] = 1;
    });
    return { total: rows.length, skipSame: skipSame, skipCross: skipCross,
      will: rows.length - skipSame - skipCross, phones: Object.keys(ph).length };
  }

      selectedCities.push(city);

      selectedProjects=selectedProjects.filter(function(projectIndex){return SCHEDULE_CATALOG[projectIndex]&&SCHEDULE_CATALOG[projectIndex].city!==city;});

    AUTO.cities=selectedCities;

  async function loadProjectCatalog() {
    try {
      var response = await fetch("/api/project-catalog", { headers: { "Accept": "application/json" } });
      if (!response.ok) throw new Error("项目目录接口返回 " + response.status);
      var rows = await response.json();
      if (!Array.isArray(rows) || !rows.length) throw new Error("项目目录为空");
      var normalized = rows.filter(function(row) {
        return row && row.city && row.projectId && row.projectName;
      }).map(function(row) {
        return { city: String(row.city), projectId: String(row.projectId), projectName: String(row.projectName) };
      });
      if (!normalized.length) throw new Error("项目目录字段不完整");
      var oldCatalog = SCHEDULE_CATALOG;
      var oldCities = AUTO.cities.slice();
      var oldSelected = AUTO.projectIndexes.map(function(i){return oldCatalog[i];}).filter(Boolean);
      var oldScope = oldCatalog.map(function(_,i){return i;}).filter(function(i){return oldCities.indexOf(oldCatalog[i].city)>=0;});
      var allWasSelected = oldScope.length>0 && oldScope.every(function(i){return AUTO.projectIndexes.indexOf(i)>=0;});
      SCHEDULE_CATALOG = normalized;
      SCHEDULE_CATALOG_SOURCE = "database";
