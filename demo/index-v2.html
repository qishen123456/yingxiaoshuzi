<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>研选责任盘 · 营销智能推送系统（Demo v2）</title>
<!--
  v2 变更：演示"必选组 + 可选组 + 命中数 + 默认优先级"新模型
  旧 demo 用 AND 全中模型，v2 替换为 mandatory/optional 双层
  - 4 条示例规则（渗漏/浴改淋/刷新/价格敏感）
  - 3 个核心页面：规则配置 / 拨号清单 / 命中解释
  - mock 8 户房主覆盖所有命中场景
  视觉规范：禁 emoji、禁紫粉渐变、走 Design Token
-->
<style>
  :root {
    --color-primary: #1d5a96;
    --color-primary-hover: #3a73b0;
    --color-primary-bg: #e8f0f8;
    --color-success: #389e0d;
    --color-success-bg: #f6ffed;
    --color-warning: #d46b08;
    --color-warning-bg: #fff7e6;
    --color-error: #cf1322;
    --color-error-bg: #fff1f0;
    --color-text: rgba(0, 0, 0, 0.88);
    --color-text-secondary: rgba(0, 0, 0, 0.65);
    --color-text-tertiary: rgba(0, 0, 0, 0.45);
    --color-border: #d9d9d9;
    --color-border-secondary: #f0f0f0;
    --color-bg: #f5f5f5;
    --color-bg-container: #ffffff;
    --color-bg-muted: #fafafa;
    --radius: 8px;
    --radius-lg: 12px;
    --shadow: 0 1px 2px rgba(0,0,0,0.06), 0 1px 6px -1px rgba(0,0,0,0.04);
    --shadow-lg: 0 6px 16px -8px rgba(0,0,0,0.08), 0 9px 28px -12px rgba(0,0,0,0.05);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --mono: "SF Mono", Consolas, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: var(--font); color: var(--color-text); background: var(--color-bg); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }

  .app { display: flex; min-height: 100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar { width: 220px; flex: 0 0 220px; background: #001529; color: rgba(255,255,255,0.65); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
  .brand { padding: 18px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; gap: 10px; }
  .brand .logo { width: 32px; height: 32px; border-radius: var(--radius); background: var(--color-primary); display: flex; align-items: center; justify-content: center; color: #fff; }
  .brand .title { color: #fff; font-weight: 600; font-size: 15px; }
  .brand .sub { color: rgba(255,255,255,0.45); font-size: 11px; }
  .nav { padding: 10px 0; flex: 1; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 20px; cursor: pointer; color: rgba(255,255,255,0.65); border-left: 3px solid transparent; }
  .nav-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
  .nav-item.active { background: var(--color-primary); color: #fff; border-left-color: #fff; }
  .nav-item svg { flex: 0 0 16px; }
  .nav-section { padding: 12px 20px 4px; font-size: 11px; color: rgba(255,255,255,0.35); letter-spacing: .04em; text-transform: uppercase; }
  .sidebar-foot { padding: 14px 20px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 11px; color: rgba(255,255,255,0.4); }

  /* ---------- Main ---------- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar { height: 56px; background: var(--color-bg-container); border-bottom: 1px solid var(--color-border-secondary); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; position: sticky; top: 0; z-index: 10; }
  .topbar .crumb { font-size: 15px; font-weight: 600; }
  .topbar .crumb .sub { font-weight: 400; color: var(--color-text-tertiary); font-size: 12px; margin-left: 8px; }
  .topbar .right { display: flex; align-items: center; gap: 12px; }
  .tag-v2 { display: inline-flex; align-items: center; gap: 6px; background: var(--color-primary-bg); color: var(--color-primary); border: 1px solid var(--color-primary); border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 500; }

  .content { padding: 24px; max-width: 1200px; width: 100%; }
  .page-head { margin-bottom: 20px; }
  .page-head h2 { margin: 0 0 4px; font-size: 20px; font-weight: 600; }
  .page-head p { margin: 0; color: var(--color-text-secondary); font-size: 13.5px; }

  /* ---------- Cards ---------- */
  .card { background: var(--color-bg-container); border: 1px solid var(--color-border-secondary); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding: 20px; margin-bottom: 16px; }
  .card .card-title { font-weight: 600; font-size: 15px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .card .card-title .meta { margin-left: auto; font-size: 12px; color: var(--color-text-tertiary); font-weight: 400; }
  .grid { display: grid; gap: 16px; }
  .grid.cols-2 { grid-template-columns: 380px 1fr; }
  .grid.kpi { grid-template-columns: repeat(4, 1fr); }
  @media (max-width: 920px) { .grid.cols-2, .grid.kpi { grid-template-columns: 1fr; } }

  .kpi { background: var(--color-bg-container); border: 1px solid var(--color-border-secondary); border-radius: var(--radius-lg); padding: 16px; }
  .kpi .k-label { color: var(--color-text-secondary); font-size: 12.5px; }
  .kpi .k-value { font-size: 24px; font-weight: 700; margin-top: 6px; letter-spacing: -.01em; }
  .kpi .k-sub { font-size: 11.5px; color: var(--color-text-tertiary); margin-top: 2px; }
  .kpi.accent { background: var(--color-primary-bg); border-color: var(--color-primary); }
  .kpi.accent .k-label { color: var(--color-primary); }
  .kpi.accent .k-value { color: var(--color-primary); }

  /* ---------- Tables ---------- */
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  thead th { text-align: left; color: var(--color-text-secondary); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--color-border); background: var(--color-bg-muted); font-size: 12.5px; }
  tbody td { padding: 10px 12px; border-bottom: 1px solid var(--color-border-secondary); vertical-align: middle; }
  tbody tr:hover { background: var(--color-bg-muted); }
  tbody tr.selected { background: var(--color-primary-bg); }
  .row-clickable { cursor: pointer; }

  /* ---------- Badges & Tags ---------- */
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 500; border: 1px solid transparent; }
  .badge.primary { background: var(--color-primary-bg); color: var(--color-primary); border-color: var(--color-primary); }
  .badge.success { background: var(--color-success-bg); color: var(--color-success); border-color: #b7eb8f; }
  .badge.warning { background: var(--color-warning-bg); color: var(--color-warning); border-color: #ffd591; }
  .badge.error { background: var(--color-error-bg); color: var(--color-error); border-color: #ffa39e; }
  .badge.neutral { background: var(--color-bg-muted); color: var(--color-text-secondary); border-color: var(--color-border); }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .tag-pill { display: inline-block; padding: 2px 8px; background: var(--color-bg-muted); border: 1px solid var(--color-border); border-radius: 999px; font-size: 11.5px; color: var(--color-text-secondary); margin: 0 4px 4px 0; }
  .tag-pill.matched { background: var(--color-primary-bg); border-color: var(--color-primary); color: var(--color-primary); }
  .tag-pill.missed { background: #fff; border-color: var(--color-border); color: var(--color-text-tertiary); text-decoration: line-through; }

  .code { font-family: var(--mono); font-size: 12px; background: var(--color-bg-muted); border: 1px solid var(--color-border-secondary); border-radius: 4px; padding: 1px 6px; color: var(--color-text); }

  /* ---------- Buttons ---------- */
  .btn { font-family: inherit; font-size: 13px; border: 1px solid var(--color-border); background: #fff; color: var(--color-text); border-radius: var(--radius); padding: 6px 14px; cursor: pointer; transition: all .15s; }
  .btn:hover { color: var(--color-primary); border-color: var(--color-primary); }
  .btn.primary { background: var(--color-primary); border-color: var(--color-primary); color: #fff; }
  .btn.primary:hover { background: var(--color-primary-hover); border-color: var(--color-primary-hover); color: #fff; }
  .btn.sm { padding: 3px 10px; font-size: 12px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ---------- Form Controls ---------- */
  .form-row { display: grid; grid-template-columns: 120px 1fr; gap: 16px; align-items: start; padding: 14px 0; border-bottom: 1px solid var(--color-border-secondary); }
  .form-row:last-child { border-bottom: none; }
  .form-row .fr-label { font-weight: 500; padding-top: 6px; }
  .form-row .fr-label .hint { display: block; font-weight: 400; color: var(--color-text-tertiary); font-size: 11.5px; margin-top: 2px; }
  .form-row .fr-control { display: flex; flex-direction: column; gap: 8px; }
  input[type="number"], input[type="text"], select { font-family: inherit; font-size: 13px; color: var(--color-text); border: 1px solid var(--color-border); border-radius: var(--radius); padding: 5px 10px; background: #fff; min-width: 100px; }
  input[type="number"]:focus, input[type="text"]:focus, select:focus { outline: none; border-color: var(--color-primary); box-shadow: 0 0 0 2px rgba(29, 90, 150, 0.1); }
  .switch { position: relative; width: 40px; height: 22px; display: inline-block; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .track { position: absolute; inset: 0; background: var(--color-border); border-radius: 999px; transition: background .2s; cursor: pointer; }
  .switch .track::before { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; background: #fff; border-radius: 50%; transition: transform .2s; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
  .switch input:checked + .track { background: var(--color-primary); }
  .switch input:checked + .track::before { transform: translateX(18px); }

  /* ---------- Condition Builder ---------- */
  .cond-group { border: 1px solid var(--color-border-secondary); border-radius: var(--radius); padding: 12px; margin-bottom: 10px; }
  .cond-group.mandatory { background: #fff8e6; border-color: #ffe58f; }
  .cond-group.optional { background: #f0f7ff; border-color: #b5d6f0; }
  .cond-group-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 13px; font-weight: 600; }
  .cond-group-head .role { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .cond-group-head .role.mandatory { background: #fa8c16; color: #fff; }
  .cond-group-head .role.optional { background: #1d5a96; color: #fff; }
  .cond-group-head .help { color: var(--color-text-tertiary); font-weight: 400; font-size: 12px; }
  .cond-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; flex-wrap: wrap; }
  .cond-row select, .cond-row input { font-size: 13px; }
  .cond-row .tag-input { flex: 1; min-width: 200px; }
  .cond-min { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 8px 10px; background: rgba(255,255,255,0.6); border-radius: var(--radius); border: 1px dashed var(--color-border); }
  .cond-min label { font-size: 12.5px; color: var(--color-text-secondary); }
  .cond-min input { width: 50px; text-align: center; }
  .add-link { color: var(--color-primary); font-size: 12.5px; cursor: pointer; user-select: none; }
  .add-link:hover { text-decoration: underline; }
  .del-link { color: var(--color-text-tertiary); cursor: pointer; font-size: 16px; line-height: 1; padding: 0 4px; }
  .del-link:hover { color: var(--color-error); }

  /* ---------- Hit Preview ---------- */
  .hit-preview { display: flex; align-items: center; gap: 16px; padding: 14px 16px; background: linear-gradient(90deg, var(--color-primary-bg), #f0f7ff); border: 1px solid var(--color-primary); border-radius: var(--radius); margin-top: 12px; }
  .hit-preview .num { font-size: 22px; font-weight: 700; color: var(--color-primary); }
  .hit-preview .lbl { font-size: 12.5px; color: var(--color-text-secondary); }
  .hit-preview .pct { font-size: 12px; color: var(--color-text-tertiary); margin-left: auto; }

  /* ---------- Rule List ---------- */
  .rule-item { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 1px solid var(--color-border-secondary); border-radius: var(--radius); margin-bottom: 8px; cursor: pointer; background: #fff; transition: all .15s; }
  .rule-item:hover { border-color: var(--color-primary); }
  .rule-item.active { border-color: var(--color-primary); background: var(--color-primary-bg); }
  .rule-item .pri { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; background: var(--color-primary); color: #fff; font-size: 12px; font-weight: 600; }
  .rule-item .nm { font-weight: 500; flex: 1; }
  .rule-item .pg { font-size: 11.5px; color: var(--color-text-tertiary); }
  .rule-item .stats { font-size: 11.5px; color: var(--color-text-tertiary); }
  .rule-item .stats b { color: var(--color-primary); font-weight: 600; }

  /* ---------- Sort Note ---------- */
  .sort-note { background: var(--color-bg-muted); border: 1px dashed var(--color-border); border-radius: var(--radius); padding: 10px 12px; font-size: 12.5px; color: var(--color-text-secondary); margin-top: 12px; line-height: 1.6; }
  .sort-note code { background: #fff; padding: 1px 5px; border-radius: 3px; border: 1px solid var(--color-border-secondary); font-family: var(--mono); font-size: 11.5px; }

  /* ---------- Explain (page 3) ---------- */
  .explain-house { padding: 16px; background: var(--color-primary-bg); border-radius: var(--radius); border: 1px solid var(--color-primary); margin-bottom: 16px; }
  .explain-house .name { font-size: 18px; font-weight: 600; }
  .explain-house .meta { color: var(--color-text-secondary); font-size: 13px; margin-top: 4px; }
  .explain-rule { padding: 14px; border: 1px solid var(--color-border); border-radius: var(--radius); margin-bottom: 10px; background: #fff; }
  .explain-rule.winner { border-color: var(--color-success); background: var(--color-success-bg); }
  .explain-rule .head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .explain-rule .head .nm { font-weight: 600; }
  .explain-rule .head .hc { margin-left: auto; color: var(--color-text-secondary); font-size: 12.5px; }
  .explain-rule .head .hc b { color: var(--color-primary); font-size: 16px; }
  .explain-section { font-size: 12.5px; color: var(--color-text-secondary); margin: 8px 0 4px; }
  .explain-section b { color: var(--color-text); }
  .explain-rule .gate { display: inline-block; padding: 2px 6px; background: var(--color-bg-muted); border: 1px solid var(--color-border-secondary); border-radius: 4px; font-family: var(--mono); font-size: 11px; color: var(--color-text-secondary); margin-left: 6px; }
  .flash { position: fixed; right: 24px; bottom: 24px; z-index: 100; background: var(--color-text); color: #fff; padding: 9px 16px; border-radius: var(--radius); font-size: 13px; box-shadow: var(--shadow-lg); opacity: 0; transform: translateY(8px); transition: opacity .18s ease, transform .18s ease; pointer-events: none; }
  .flash.show { opacity: 1; transform: translateY(0); }
</style>
</head>

  var TAG_DICT = {

  };

  function houseHasTag(house, tagKey) {
    if (tagKey === "decorate_status") return [house.decorate];
    if (tagKey === "water_tag") return house.water;
    if (tagKey === "env_tag") return house.env;
    if (tagKey === "floor_plan") return house.layout.indexOf("浴缸") >= 0 ? ["带浴缸"] : [];
    if (tagKey === "price_sensitivity") return [house.price];
    if (tagKey === "activity_level") return [house.active];
    return [];
  }

  function evalCondition(cond, house) {
    var houseVals = houseHasTag(house, cond.tag);
    if (cond.op === "in") {
      return cond.value.some(function(v){ return houseVals.indexOf(v) >= 0; });
    }
    if (cond.op === "contains_any") {
      return cond.value.some(function(v){ return houseVals.indexOf(v) >= 0; });
    }
    if (cond.op === "contains_all") {
      return cond.value.every(function(v){ return houseVals.indexOf(v) >= 0; });
    }
    if (cond.op === "eq") return houseVals[0] === cond.value[0];
    if (cond.op === "neq") return houseVals[0] !== cond.value[0];
    return false;
  }

  function evalRule(rule, house) {
    var mandHit = 0, optHit = 0;
    var mandDetail = [], optDetail = [];
    rule.mandatory.forEach(function(c){
      var hit = evalCondition(c, house);
      if (hit) mandHit++;
      mandDetail.push({ cond: c, hit: hit });
    });
    rule.optional.forEach(function(c){
      var hit = evalCondition(c, house);
      if (hit) optHit++;
      optDetail.push({ cond: c, hit: hit });
    });
    var passed = (mandHit === rule.mandatory.length) && (optHit >= rule.minOptionalHits);
    var hitCount = mandHit + optHit;
    return { passed: passed, hitCount: hitCount, mandHit: mandHit, optHit: optHit, mandDetail: mandDetail, optDetail: optDetail };
  }

  function selectWinningRule(house, rules) {
    var hits = rules.map(function(r){
      return { rule: r, eval: evalRule(r, house) };
    }).filter(function(x){ return x.eval.passed; });
    if (hits.length === 0) return null;
    hits.sort(function(a, b){
      if (a.rule.manual_priority !== b.rule.manual_priority) return a.rule.manual_priority - b.rule.manual_priority;
      if (a.eval.hitCount !== b.eval.hitCount) return b.eval.hitCount - a.eval.hitCount;
      return a.rule.id - b.rule.id;
    });
    return hits;
  }

  /* ============ 频控（mock：每户每天最多 1 条 + 7 天冷却） ============ */
  function canPush(house) {
    if (house.lastPush === "—") return { ok: true, reason: null };
    var lastDate = new Date(house.lastPush.replace("短信","").replace("企微","").trim());
    var now = new Date("2026-10-09");
    var diffDays = Math.floor((now - lastDate) / 86400000);
    if (diffDays < 7) return { ok: false, reason: "7 天内已推送（" + house.lastPush + "）" };
    return { ok: true, reason: null };
  }

        return a.rule.manual_priority - b.rule.manual_priority;
      }).map(function(x){
        var e = x.eval;
        return '<div class="explain-rule ' + (x.isWinner ? "winner" : "") + '">' +
          '<div class="head">' +
            '<span class="pri" style="display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:' + (x.isWinner ? "var(--color-success)" : "var(--color-bg-muted)") + ';color:' + (x.isWinner ? "#fff" : "var(--color-text)") + ';font-size:12px;font-weight:600">' + x.rule.manual_priority + '</span>' +
            '<span class="nm">' + x.rule.name + (x.isWinner ? ' <span class="badge success">胜出</span>' : '') + '</span>' +
            '<span class="hc">匹配度 <b>' + e.hitCount + '</b> / ' + (x.rule.mandatory.length + x.rule.optional.length) + '</span>' +
          '</div>' +

          '<div class="explain-section"><b>硬性门槛（必须全部命中）</b>' +
            (x.rule.mandatory.length === 0 ? ' <span style="color:var(--color-text-tertiary)">无</span>' :
              ' — 命中 ' + e.mandHit + ' / ' + x.rule.mandatory.length + x.rule.mandatory.map(function(c,i){
                return ' <span class="gate">' + c.tag + ' ∈ {' + c.value.join(",") + '}</span> ' + (e.mandDetail[i].hit ? '<span style="color:var(--color-success)">' + icon("check", 12) + '</span>' : '<span style="color:var(--color-error)">' + icon("x", 12) + '</span>');
              }).join("")
            ) +
          '</div>' +

          '<div class="explain-section"><b>加分项（至少命中 ' + x.rule.minOptionalHits + ' 个）</b>' +
            ' — 命中 ' + e.optHit + ' / ' + x.rule.optional.length + x.rule.optional.map(function(c,i){
              return ' <span class="gate">' + c.tag + ' ∋ {' + c.value.join(",") + '}</span> ' + (e.optDetail[i].hit ? '<span style="color:var(--color-success)">' + icon("check", 12) + '</span>' : '<span style="color:var(--color-error)">' + icon("x", 12) + '</span>');
            }).join("") +
          '</div>' +

          '<div style="margin-top:8px;font-size:12.5px">' +
            (e.passed ?
              '<span style="color:var(--color-success)">' + icon("check", 12) + ' 命中</span> · 推送产品：' + x.rule.package :
              '<span style="color:var(--color-text-tertiary)">' + icon("x", 12) + ' 不命中</span> · ' + (e.mandHit < x.rule.mandatory.length ? "硬性门槛未全部通过" : "加分项命中数 " + e.optHit + " < " + x.rule.minOptionalHits)
            ) +
          '</div>' +
        '</div>';
      }).join("") +

      (winners && winners.length > 1 ?
        '<div class="card" style="border-color:var(--color-warning);background:var(--color-warning-bg)">' +
          '<div class="card-title" style="color:var(--color-warning)">' + icon("zap", 14) + ' 同户命中多条规则 · 三级排序结果</div>' +
          winners.map(function(x, i){
            return '<div style="display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13px">' +
              '<span style="display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:' + (i === 0 ? "var(--color-success)" : "var(--color-bg-muted)") + ';color:' + (i === 0 ? "#fff" : "var(--color-text-secondary)") + ';font-size:11px;font-weight:600">' + (i+1) + '</span>' +
              '<b>' + x.rule.name + '</b>' +
              '<span style="color:var(--color-text-secondary)">匹配度 ' + x.eval.hitCount + ' · 默认优先级 ' + x.rule.manual_priority + '</span>' +
              (i === 0 ? '<span class="badge success">胜出</span>' : '<span class="badge neutral">备选</span>') +
            '</div>';
          }).join("") +
        '</div>'
      : '') +
      '';
  }

  /* ============ 全局事件 ============ */
  window._go = function(id){ go(id); render(); };
  window._selRule = function(id){ selectedRuleId = id; render(); };
  window._selHouse = function(id){ selectedHouseId = id; if (currentPage() !== "explain") { go("explain"); } render(); };
  window._updRule = function(id, key, val){
    var r = RULES.find(function(x){ return x.id === id; });
    r[key] = val;
    render();
    flash("已修改（未保存）");
  };
  window._updTag = function(id, group, idx, val){
    var r = RULES.find(function(x){ return x.id === id; });
    r[group][idx].tag = val;
    render();
  };
  window._addCond = function(id, group){
    var r = RULES.find(function(x){ return x.id === id; });
    var defaults = { mandatory: { tag: "decorate_status", op: "in", value: ["5-10年"] }, optional: { tag: "water_tag", op: "contains_any", value: ["卫生间漏水"] } };
    r[group].push(JSON.parse(JSON.stringify(defaults[group])));
    render();
  };
  window._delCond = function(id, group, idx){
    var r = RULES.find(function(x){ return x.id === id; });
    r[group].splice(idx, 1);
    render();
  };
  window._addVal = function(id, group, idx, val){
    if (!val.trim()) return;
    var r = RULES.find(function(x){ return x.id === id; });
    r[group][idx].value.push(val.trim());
    render();
  };
  window._delVal = function(id, group, idx, vi){
    var r = RULES.find(function(x){ return x.id === id; });
    r[group][idx].value.splice(vi, 1);
    render();
  };
  window._save = function(){ flash("规则已保存（演示，未持久化）"); };
  window._reset = function(){
    RULES = JSON.parse(JSON.stringify(DEFAULT_RULES));
    render();
    flash("已重置为默认规则");
  };

  function render() {
    renderNav();
    renderCrumb();
    var p = PAGES.find(function(x){ return x.id === currentPage(); });
    p.render();
  }
  window.addEventListener("hashchange", render);

  // expose
  window._PAGES = PAGES;
  window._RULES = RULES;
  window._HOUSES = HOUSES;

  render();
})();
</script>
</body>
</html>
