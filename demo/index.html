    if (!c.lastLeadAt) return { state: 'clear', code: null, remaining: null };
    var days = daysBetween(parse(c.lastLeadAt), DEMO_NOW);
    if (c.lastLeadPackageId === pkgId) {
      if (days <= state.freq.leadPackageCooldownDays) {
        return { state: 'lead_package_cooldown', code: 'LEAD_PACKAGE_COOLDOWN', remaining: state.freq.leadPackageCooldownDays - days };
      }
      return { state: 'clear', code: null, remaining: null };
    }
    if (days <= state.freq.leadHouseCooldownDays) {
      return { state: 'lead_house_cooldown', code: 'LEAD_HOUSE_COOLDOWN', remaining: state.freq.leadHouseCooldownDays - days };
    }
    return { state: 'clear', code: null, remaining: null };
  }

    /* 新增后聚焦新行的名称输入 */
    if (state.pendingFocus) {
      var inp = document.querySelector('[data-pkg="' + state.pendingFocus + '"][data-field="name"]');
      if (inp) { inp.focus(); inp.select(); }
      state.pendingFocus = null;
    }
  }

  function renderFrequency() {
    var f = state.freq;
    function row(label, hint, control) {
      return '<div class="form-row"><div class="fr-label">' + label + (hint ? '<span class="hint">' + hint + '</span>' : '') + '</div><div class="fr-control">' + control + '</div></div>';
    }
    function sw(key, on) {
      return '<label class="switch"><input type="checkbox" data-freq="' + key + '" ' + (on ? 'checked' : '') + '/><span class="track"></span></label>';
    }
    function num(key, val, min, max) {
      return '<input type="number" data-freq="' + key + '" value="' + val + '" min="' + min + '" max="' + max + '" style="width:90px" /> <span class="muted">天</span>';
    }
    var html =
      '<div class="page-head"><h2>频控配置</h2><p>常规频控 + 本次新增「线索静默闸门 0」（优先级高于全部常规频控）。</p></div>' +
      '<div class="card"><div class="card-title">' + icon('sliders', 18) + ' 常规频控</div>' +
      row('单客户每日上限', '建议值 2 条/天（待确认 #3）', num('globalDailyCap', f.globalDailyCap, 1, 20).replace('天', '条/天')) +
      row('单客户冷却天数', '同单元两次推送最小间隔', num('customerCooldownDays', f.customerCooldownDays, 0, 60).replace('天', '天')) +
      row('服务通知豁免打扰控制', '服务通知不占频控额度（建议：豁免，待确认 #4）', sw('serviceNotifyExempt', f.serviceNotifyExempt)) +
      '</div>' +
      '<div class="card"><div class="card-title">' + icon('clock', 18) + ' 线索静默闸门 0（本次新增）</div>' +
      '<div class="stat-block">闸门 0 优先级最高：客户近期已产生线索时，即便常规频控允许也不再推送，避免「已成交还狂推」。<br/>0a 同包冷却 ' + f.leadPackageCooldownDays + ' 天 · 0b 跨包冷却 ' + f.leadHouseCooldownDays + ' 天。改下方数值会实时影响「圈人预览」拦截结果。</div>' +
      row('同包线索冷却（闸门 0a）', 'LEAD_PACKAGE_COOLDOWN，范围 1-365', num('leadPackageCooldownDays', f.leadPackageCooldownDays, 1, 365)) +
      row('跨包线索冷却（闸门 0b）', 'LEAD_HOUSE_COOLDOWN，范围 1-90', num('leadHouseCooldownDays', f.leadHouseCooldownDays, 1, 90)) +
      row('外部缺失时的失败模式', 'open=放行并标「未生效」；closed=硬拦截',
        '<select data-freq="leadGateFailMode"><option value="open"' + (f.leadGateFailMode === 'open' ? ' selected' : '') + '>open（放行+标未生效）</option><option value="closed"' + (f.leadGateFailMode === 'closed' ? ' selected' : '') + '>closed（硬拦截）</option></select>') +
      '<div class="pill-note">这三个字段已在契约（openapi FrequencyRule）中锁定，前端改动真实生效，非死控件（规避反向 P8）。</div>' +
      '</div>';
    $('#content').innerHTML = html;
    Array.prototype.forEach.call(document.querySelectorAll('[data-freq]'), function (el) {
      el.addEventListener('input', function () {
        var k = el.getAttribute('data-freq');
        if (el.type === 'checkbox') state.freq[k] = el.checked;
        else if (el.tagName === 'SELECT') state.freq[k] = el.value;
        else state.freq[k] = parseInt(el.value, 10) || 0;
        renderFrequency();
      });
    });
  }

  function renderAudience() {
    var enabled = packages.filter(function (p) { return p.enabled !== false; });
    if (!enabled.length) enabled = packages.slice();
    if (!enabled.some(function (p) { return p.id === state.currentPkg; })) {
      state.currentPkg = enabled.length ? enabled[0].id : null;
    }
    var pkgs = enabled.map(function (p) { return '<option value="' + p.id + '"' + (state.currentPkg === p.id ? ' selected' : '') + '>' + p.name + '</option>'; }).join('');
    var matched = 0, silenced = 0;
    var rows = customers.map(function (c) {
      var g = gateForPackage(c, state.currentPkg);
      if (g.state === 'clear') matched++; else silenced++;
      var gateCell = g.state === 'clear' ? gateBadge(g) : gateBadge(g) + (g.code ? ' <span class="code-chip">' + g.code + '</span>' : '');
      return '<tr><td><strong>' + c.name + '</strong><br/><span class="muted">' + c.phone + '</span></td>' +
        '<td>' + c.tags.map(function (t) { return '<span class="badge neutral">' + t + '</span>'; }).join(' ') + '</td>' +
        '<td>' + gateCell + '</td></tr>';
    }).join('');
    $('#content').innerHTML =
      '<div class="page-head"><h2>自动圈人预览</h2><p>选产品包 → 实时计算命中客户与「线索静默闸门 0」拦截结果。</p></div>' +
      '<div class="toolbar"><div class="select-inline">产品包：<select id="pkg-sel">' + pkgs + '</select></div>' +
      '<span class="badge success">' + icon('check', 13) + ' 可推送 ' + matched + '</span>' +
      '<span class="badge warning">' + icon('alert', 13) + ' 静默 ' + silenced + '</span></div>' +
      '<div class="card"><table><thead><tr><th>客户</th><th>标签</th><th>可推状态 / 原因码</th></tr></thead><tbody>' + rows + '</tbody></table>' +
      '<div class="pill-note">闸门 0 优先级高于常规频控：同包线索≤' + state.freq.leadPackageCooldownDays + '天 → LEAD_PACKAGE_COOLDOWN；跨包线索≤' + state.freq.leadHouseCooldownDays + '天 → LEAD_HOUSE_COOLDOWN；线索系统未回流 → data_unavailable（降级态）。</div></div>';
    $('#pkg-sel').addEventListener('change', function () { state.currentPkg = this.value; renderAudience(); });
  }

  function renderPushes() {
    var rows = pushes.map(function (p) {
      var leadsFor = leads.filter(function (l) {
        return (state.attributionMode === 'first' ? l.firstTouchPushId : l.lastTouchPushId) === p.id;
      });
      var expand = state.expandedPush === p.id;
      var caret = '<span style="display:inline-flex;transform:rotate(' + (expand ? 90 : 0) + 'deg);transition:transform .15s">' + icon('chevron', 14) + '</span>';
      var leadInfo = leadsFor.length ? leadsFor.map(function (l) { return cust(l.customerId).name + '（' + QUALITY_META[l.quality].label + '质）'; }).join('、') : '无';
      var main = '<tr class="expander" data-push="' + p.id + '"><td><strong>' + pkgName(p.packageId) + '</strong></td>' +
        '<td>' + p.channel + '</td><td>' + p.sentAt + '</td>' +
        '<td>' + p.targetCount + '</td><td>' + p.sentCount + '</td>' +
        '<td><strong>' + p.leadCount + '</strong></td>' +
        '<td><span class="badge success">' + icon('check', 13) + ' 已发送</span></td>' +
        '<td>' + caret + '</td></tr>';
      var sub = expand ? '<tr class="expand-row"><td colspan="8">归因摘要（' + (state.attributionMode === 'first' ? '首触' : '末触') + '口径）：命中线索 ' + leadsFor.length + ' 条 → ' + leadInfo + '</td></tr>' : '';
      return main + sub;
    }).join('');
    $('#content').innerHTML =
      '<div class="page-head"><h2>推送记录</h2><p>每次发送的真实线索结果（leadCount）。点击行展开归因摘要。</p></div>' +
      '<div class="toolbar"><div class="select-inline">归因口径：</div><div class="seg">' +
      '<button data-mode="first" class="' + (state.attributionMode === 'first' ? 'on' : '') + '">首触</button>' +
      '<button data-mode="last" class="' + (state.attributionMode === 'last' ? 'on' : '') + '">末触</button></div></div>' +
      '<div class="card"><table><thead><tr><th>产品包</th><th>通道</th><th>发送时间</th><th>目标数</th><th>实际发送</th><th>线索结果</th><th>状态</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>' +
      '<div class="pill-note">线索结果来自外部线索系统回填（非埋点）；归因按 first_touch_push_id / last_touch_push_id 双字段，15 天窗口为固定常量。</div></div>';
    Array.prototype.forEach.call(document.querySelectorAll('[data-push]'), function (el) {
      el.addEventListener('click', function () {
        var id = el.getAttribute('data-push');
        state.expandedPush = state.expandedPush === id ? null : id;
        renderPushes();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-mode]'), function (el) {
      el.addEventListener('click', function () { state.attributionMode = el.getAttribute('data-mode'); renderPushes(); });
    });
  }

  function renderTimeline() {
    var opts = customers.map(function (c) { return '<option value="' + c.id + '"' + (state.currentCustomer === c.id ? ' selected' : '') + '>' + c.name + '</option>'; }).join('');
    var c = cust(state.currentCustomer);
    var g = timelineState(c);
    // 事件：该客户的推送（按其命中包近似——此处用其 lastLeadPackageId 相关推送 + 全部其可能收到；demo 简化：展示其相关推送与线索）
    var events = [];
    pushes.forEach(function (p) {
      // 简化：若该客户标签匹配包标签则视为可能收到（演示用）
      var tagsOk = p.packageId === c.lastLeadPackageId || (c.tags.length && packages.filter(function (x) { return x.id === p.packageId; })[0] && packages.filter(function (x) { return x.id === p.packageId; })[0].tags.some(function (t) { return c.tags.indexOf(t) >= 0; }));
      if (tagsOk) events.push({ date: p.sentAt, type: 'push', text: '推送「' + pkgName(p.packageId) + '」· ' + p.channel + '（发送 ' + p.sentCount + ' 条）' });
    });
    leads.filter(function (l) { return l.customerId === c.id; }).forEach(function (l) {
      events.push({ date: l.createdAt, type: 'lead', text: '产生线索 ' + l.id + ' · 质量' + QUALITY_META[l.quality].label + ' · 来源 ' + SOURCE_META[l.source] + (l.externalPackageCode ? '（' + l.externalPackageCode + '）' : '') });
    });
    events.sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    var tl = events.map(function (e) {
      var cls = e.type === 'lead' ? 'lead' : (g.state !== 'clear' ? 'cool' : '');
      return '<div class="ev ' + cls + '"><div class="when">' + e.date + '</div><div class="what">' + (e.type === 'lead' ? icon('check', 14) + ' ' : icon('send', 14) + ' ') + e.text + '</div></div>';
    }).join('') || '<div class="muted">暂无事件</div>';
    $('#content').innerHTML =
      '<div class="page-head"><h2>客户线索时间线</h2><p>单客户推送与线索事件流，顶部显示当前可推状态（四态之一）。</p></div>' +
      '<div class="toolbar"><div class="select-inline">客户：<select id="cust-sel">' + opts + '</select></div>' + gateBadge(g) + '</div>' +
      '<div class="card"><div class="tl">' + tl + '</div>' +
      '<div class="pill-note">四态：clear（可推）/ lead_package_cooldown（同包线索冷却，剩 ' + (g.remaining != null ? g.remaining : '-') + ' 天）/ lead_house_cooldown（跨包线索冷却）/ data_unavailable（线索系统未回流，降级态）。当前客户「' + c.name + '」基于最近线索所属包判定。</div></div>';
    $('#cust-sel').addEventListener('change', function () { state.currentCustomer = this.value; renderTimeline(); });
  }

  function renderDashboard() {
    var totalSent = pushes.reduce(function (s, p) { return s + p.sentCount; }, 0);
    var totalLeads = leads.length;
    var conv = (totalLeads / totalSent * 100).toFixed(2);
    var qScore = Math.round(leads.reduce(function (s, l) { return s + (l.quality === 'high' ? 100 : l.quality === 'mid' ? 70 : 40); }, 0) / totalLeads);
    var clicks = Math.round(totalSent * 0.12);
    var byPkg = {};
    packages.forEach(function (p) { byPkg[p.id] = 0; });
    leads.forEach(function (l) { byPkg[l.packageId] = (byPkg[l.packageId] || 0) + 1; });
    var qDist = { high: 0, mid: 0, low: 0 };
    leads.forEach(function (l) { qDist[l.quality]++; });
    var pkgRows = packages.map(function (p) {
      return '<tr><td>' + p.name + '</td><td>' + byPkg[p.id] + '</td><td>' + (byPkg[p.id] / totalLeads * 100).toFixed(0) + '%</td></tr>';
    }).join('');
    function funnelBar(val, max, step) {
      var w = Math.max(8, Math.round(val / max * 100));
      return '<div class="bar" style="width:' + w + '%">' + val.toLocaleString() + '</div>';
    }
    $('#content').innerHTML =
      '<div class="page-head"><h2>效果看板</h2><p>推送后的真实效果：KPI · 漏斗 · 分维度 · 质量分布。</p></div>' +
      '<div class="grid kpi">' +
      kpi('send', '总发送', totalSent.toLocaleString(), '覆盖 ' + pushes.length + ' 次推送') +
      kpi('target', '总线索', totalLeads, '外部系统回填') +
      kpi('bar', '转化率', conv + '%', '线索 / 发送') +
      kpi('check', '平均质量分', qScore, '高100/中70/低40') +
      '</div>' +
      '<div class="grid cols-2">' +
      '<div class="card"><div class="card-title">' + icon('bar', 18) + ' 转化漏斗</div><div class="funnel">' +
      '<div class="step"><div class="bar" style="width:100%">' + totalSent.toLocaleString() + '</div><span class="meta">曝光（发送量）</span></div>' +
      '<div class="step s2"><div class="bar" style="width:' + Math.round(clicks / totalSent * 100) + '%">' + clicks.toLocaleString() + '</div><span class="meta">点击（演示率 12%）</span></div>' +
      '<div class="step s3"><div class="bar" style="width:' + Math.max(8, Math.round(totalLeads / totalSent * 100)) + '%">' + totalLeads + '</div><span class="meta">线索</span></div>' +
      '</div></div>' +
      '<div class="card"><div class="card-title">' + icon('bar', 18) + ' 质量分布</div>' +
      '<div class="funnel">' +
      '<div class="step s3"><div class="bar" style="width:' + Math.round(qDist.high / totalLeads * 100) + '%">' + qDist.high + '</div><span class="meta">高质量</span></div>' +
      '<div class="step s2"><div class="bar" style="width:' + Math.round(qDist.mid / totalLeads * 100) + '%">' + qDist.mid + '</div><span class="meta">中质量</span></div>' +
      '<div class="step"><div class="bar" style="width:' + Math.round(qDist.low / totalLeads * 100) + '%">' + qDist.low + '</div><span class="meta">低质量</span></div>' +
      '</div></div>' +
      '</div>' +
      '<div class="card"><div class="card-title">' + icon('branch', 18) + ' 分维度（按产品包）</div><table><thead><tr><th>产品包</th><th>线索数</th><th>占比</th></tr></thead><tbody>' + pkgRows + '</tbody></table></div>' +
      '<div class="card"><div class="card-title">' + icon('info', 18) + ' 归因局限与数据缺口</div>' +
      '<div class="stat-block">本看板为宏观效果，归因存在客观局限，使用前请知悉：<br/>' +
      '1. 线索回填依赖外部线索系统（CRM）对接，未对接则「线索结果」为空、时间线显 data_unavailable（降级态，非假装拦截）。<br/>' +
      '2. 点击归因依赖通道回执 / 带参短链，不支持则仅能到「包级宏观相关性」，无法精确到单次推送。<br/>' +
      '3. 归因窗口固定 15 天常量（不可配、不分通道），与冷却期数值接近但语义不同源。<br/>' +
      '4. package_source 三值（external / inferred / none）分开统计，none 不掩盖集成问题。</div></div>';
    function kpi(ic, label, val, sub) {
      return '<div class="kpi-card"><div class="k-label">' + icon(ic, 14) + ' ' + label + '</div><div class="k-value">' + val + '</div><div class="k-sub">' + sub + '</div></div>';
    }
  }

  function renderAttribution() {
    var rows = leads.map(function (l) {
      var fp = pushes.filter(function (p) { return p.id === l.firstTouchPushId; })[0];
      var lp = pushes.filter(function (p) { return p.id === l.lastTouchPushId; })[0];
      return '<tr><td><strong>' + l.id + '</strong></td><td>' + cust(l.customerId).name + '</td><td>' + pkgName(l.packageId) + '</td>' +
        '<td>' + l.createdAt + '</td>' +
        '<td><span class="badge ' + QUALITY_META[l.quality].cls + '">' + QUALITY_META[l.quality].label + '</span></td>' +
        '<td><span class="code-chip">' + SOURCE_META[l.source] + '</span>' + (l.externalPackageCode ? ' ' + l.externalPackageCode : '') + '</td>' +
        '<td>' + (fp ? fp.id + '（' + fp.sentAt + '）' : '—') + '</td>' +
        '<td>' + (lp ? lp.id + '（' + lp.sentAt + '）' : '—') + '</td></tr>';
    }).join('');
    $('#content').innerHTML =
      '<div class="page-head"><h2>归因分析</h2><p>每条线索双口径归因：首触 / 末触，15 天窗口为固定常量。</p></div>' +
      '<div class="card"><table><thead><tr><th>线索</th><th>客户</th><th>产品包</th><th>产生时间</th><th>质量</th><th>来源</th><th>首触推送</th><th>末触推送</th></tr></thead><tbody>' + rows + '</tbody></table>' +
      '<div class="pill-note">首触 = 窗口内最早一次推送；末触 = 窗口内最晚一次推送。例：lead-5 / lead-6 同处 p-1 与 p-2 的 15 天窗口内 → 首触 p-1、末触 p-2，双口径可切换对比。来源 none 表示上游未给包码（集成问题，非推断）。</div></div>';
  }

  /* ============ 渲染调度 ============ */
  function render() {
    var h = location.hash || '#/packages';
    renderNav();
    renderCrumb();
    if (h === '#/packages') renderPackages();
    else if (h === '#/frequency') renderFrequency();
    else if (h === '#/audience') renderAudience();
    else if (h === '#/pushes') renderPushes();
    else if (h === '#/timeline') renderTimeline();
    else if (h === '#/dashboard') renderDashboard();
    else if (h === '#/attribution') renderAttribution();
    else showPending();
  }

  // 品牌图标
  document.getElementById('brand-logo').innerHTML = icon('send', 18);

  window.addEventListener('hashchange', render);
  if (!location.hash) location.hash = '#/packages';
  render();
})();
</script>
</body>
</html>
