  function applyFilter(){
    var project=document.getElementById("fProject")?document.getElementById("fProject").value:"";
    var product=document.getElementById("fProduct")?document.getElementById("fProduct").value:"";
    var lead=document.getElementById("fLead")?document.getElementById("fLead").value:"";
    var hasLead=document.getElementById("fHasLead")?document.getElementById("fHasLead").value:"";
    var keyword=(document.getElementById("fKeyword")?document.getElementById("fKeyword").value:"").trim().toLowerCase();
    var move=document.querySelector("[data-move-filter].selected");var moveValue=move?move.getAttribute("data-move-filter"):"";
    var labelButtons=document.querySelectorAll("[data-label-filter].selected");
    var quickLabels=Array.from(labelButtons).map(function(b){return b.getAttribute("data-label-filter");}).filter(Boolean);
    var tagsPicked=Array.from(document.querySelectorAll(".tag-filter:checked")).map(function(c){return c.value;});
    return houses.filter(function(h){
      if(project&&h.project!==project)return false;
      if(product&&h.product!==product)return false;
      if(lead&&h.leadStatus!==lead)return false;
      if(hasLead&&h.hasLead!==hasLead)return false;
      if(moveValue&&h.moveStatus!==moveValue)return false;
      if(keyword&&([h.house,h.owner,h.mobile,h.project,h.unit].join(" ").toLowerCase().indexOf(keyword)<0))return false;
      if(quickLabels.length&&!quickLabels.some(function(t){return h.labels.indexOf(t)>=0;}))return false;
      if(tagsPicked.length&&!tagsPicked.every(function(t){return h.labels.indexOf(t)>=0;}))return false;
      return true;
    });
  }

  }
  function bindPackageCards(){
    document.querySelectorAll("[data-package-push]").forEach(function(b){b.onclick=function(){var p=audiencePackages.find(function(x){return x.id===b.getAttribute("data-package-push");});if(p)openPushModal(p.houseIds.map(houseById).filter(Boolean),p);};});
    document.querySelectorAll("[data-package-detail]").forEach(function(b){b.onclick=function(){var p=audiencePackages.find(function(x){return x.id===b.getAttribute("data-package-detail");});if(p)showPackageDetail(p);};});

  function openSavePackageModal(list){
    var body='<div class="form-grid"><div class="field full"><label>人群包名称 *</label><input id="packageName" class="control" value="临湖花园 · 标签筛选人群包" maxlength="80" placeholder="例如：临湖花园-高频维修-10月"></div><div class="field full"><label>筛选条件摘要</label><textarea id="packageCriteria" class="textarea" style="min-height:65px">项目 / 标签等当前筛选条件；本次快照共 '+list.length+' 套房屋。</textarea><div class="help">保存后锁定当前房屋明细快照；后续底账更新不会自动改变此人群包。</div></div><div class="field"><label>房屋数量</label><input class="control" value="'+list.length+' 套" disabled></div><div class="field"><label>创建人</label><input class="control" value="刘文琪（当前用户）" disabled></div></div>';
    modal("保存为人群包","将当前勾选的房屋保存为可复用的人群快照。",body,'<span class="foot-hint">此操作只保存人群包，不会发送消息。</span><div><button class="btn" data-close-modal>取消</button> <button class="btn btn-primary" id="confirmSavePackage">保存人群包</button></div>');
    document.getElementById("confirmSavePackage").onclick=function(){
      var name=document.getElementById("packageName").value.trim();if(!name){toast("请填写人群包名称");return;}
      var ids=list.map(function(h){return h.id;});
      var criteria=document.getElementById("packageCriteria").value.trim();

      closeModal();renderView();toast("人群包已保存，共 "+ids.length+" 套房屋");
    };

  function openPushModal(list,pack){
    if(!list||!list.length){toast("请先筛选并勾选房屋，或从已保存人群包发起推送");return;}
    pendingPoster="";pendingPosterName="";
    var name=pack?pack.name:"潜客挖掘 · "+(new Date().toISOString().slice(0,10))+" 推送人群";
    var criteria=pack?pack.criteria:"根据当前项目、产品、标签等筛选条件生成；以勾选房屋为准。";
    var body='<div class="push-summary"><div class="push-summary-item"><span>本次推送对象</span><b>'+list.length+' 套房屋</b></div><div class="push-summary-item"><span>触达人员</span><b>'+new Set(list.map(function(h){return h.mobile;})).size+' 个号码</b></div><div class="push-summary-item"><span>推送发起人</span><b>刘文琪</b></div></div>'+
      '<div class="form-grid" style="margin-top:15px">'+
        '<div class="field full"><label>推送人群包名称 *</label><input class="control" id="pushPackageName" value="'+esc(name)+'" maxlength="100"></div>'+
        '<div class="field full"><label>本次人群包规则 / 来源</label><textarea id="pushCriteria" class="textarea" style="min-height:62px">'+esc(criteria)+'</textarea><div class="help">这段说明会与本次发送内容一并写入推送记录。</div></div>'+
        '<div class="field full"><label>上传海报（可选，支持 PNG / JPG / WEBP）</label><div class="upload-zone" id="uploadZone"><div id="posterPreviewArea"><div class="upload-icon">▧</div><b>点击选择海报图片，或将图片拖放到此处</b><div class="help">Demo 仅在当前浏览器会话中预览与留存；真实环境需接入对象存储。</div></div><input id="posterFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></div></div>'+
        '<div class="field full"><label>推送文案 *</label><textarea class="textarea" id="pushContent" maxlength="1000" placeholder="请填写推送给业主的消息文案">您好，关注到您家的房屋情况，我们为您准备了专属焕新服务。近期可预约上门检测，了解适合您家的改善方案。回复【预约】获取详情。</textarea><div class="help"><span id="contentLength">0</span>/1000 字。发送前请由业务负责人确认文案合规、活动有效期及退订话术。</div></div>'+
        '<div class="field full"><label>触达渠道 *</label><div class="channel-row"><label class="channel-option"><input type="checkbox" name="pushChannel" value="企微通知" checked>企微通知</label><label class="channel-option"><input type="checkbox" name="pushChannel" value="推广短信">推广短信</label><label class="channel-option"><input type="checkbox" name="pushChannel" value="Call客任务">生成 Call 客任务</label></div><div class="help">当前均为模拟操作，不会连接公司真实通道；正式发送需接通后端统一闸门。</div></div>'+
      '</div>';
    modal("配置推送内容","上传海报、填写文案、选择渠道，并在确认后生成可追溯的推送批次。",body,'<span class="foot-hint">本 Demo 只创建推送记录，不真实联系业主。</span><div><button class="btn" data-close-modal>取消</button> <button class="btn btn-primary" id="confirmPush">确认并模拟推送</button></div>',true);
    var content=document.getElementById("pushContent");
    var updateLength=function(){document.getElementById("contentLength").textContent=content.value.length;};
    updateLength();content.addEventListener("input",updateLength);
    var input=document.getElementById("posterFile");
    input.addEventListener("change",function(){
      var file=input.files&&input.files[0];if(!file)return;
      if(!file.type.match(/^image\//)){toast("请选择图片文件");input.value="";return;}
      if(file.size>8*1024*1024){toast("Demo 图片请小于 8MB");input.value="";return;}
      pendingPosterName=file.name;
      var reader=new FileReader();
      reader.onload=function(){pendingPoster=String(reader.result||"");document.getElementById("posterPreviewArea").innerHTML='<img class="poster-preview" src="'+pendingPoster+'" alt="海报预览"><div style="text-align:left"><b>'+esc(file.name)+'</b><div class="help">海报已加载，确认推送后会随批次信息一起记录。</div><button type="button" class="btn btn-small" id="removePoster" style="margin-top:7px">移除图片</button></div>';document.getElementById("removePoster").onclick=function(e){e.stopPropagation();pendingPoster="";pendingPosterName="";input.value="";document.getElementById("posterPreviewArea").innerHTML='<div class="upload-icon">▧</div><b>点击选择海报图片，或将图片拖放到此处</b><div class="help">Demo 仅在当前浏览器会话中预览与留存；真实环境需接入对象存储。</div>';};};
      reader.readAsDataURL(file);
    });
    document.getElementById("confirmPush").onclick=function(){
      var packName=document.getElementById("pushPackageName").value.trim();
      var textValue=document.getElementById("pushContent").value.trim();
      var channels=Array.from(document.querySelectorAll('input[name="pushChannel"]:checked')).map(function(c){return c.value;});
      if(!packName){toast("请填写推送人群包名称");return;}
      if(!textValue){toast("请填写推送文案");return;}
      if(!channels.length){toast("至少选择一个触达渠道");return;}
      var rec={id:"PUSH-"+new Date().toISOString().replace(/[-:T.Z]/g,"").slice(0,14)+"-"+String(pushRecords.length+1).padStart(3,"0"),packageName:packName,sender:"刘文琪",createdAt:nowText(),channels:channels,content:textValue,posterName:pendingPosterName||"未上传海报",posterData:pendingPoster,count:list.length,criteria:document.getElementById("pushCriteria").value.trim(),houseIds:list.map(function(h){return h.id;}),status:"模拟完成",detail:"这是前端演示批次：已保存文案与人群明细，但未调用短信、企微或其他真实触达接口。"};
      pushRecords.unshift(rec);closeModal();navTo("records");toast("演示推送已记录： "+list.length+" 套房屋；未真实发送");
    };
  }

      '<div class="tag-cards"><div class="panel tag-summary"><div class="tag-summary-head"><b>标签字典</b><span class="status-pill blue">系统维护</span></div><strong>'+tags.length+'</strong><small>总标签数 · 含停用项</small></div><div class="panel tag-summary"><div class="tag-summary-head"><b>启用标签</b><span class="status-pill green">可用于筛选</span></div><strong>'+enabled+'</strong><small>只将启用状态的标签展示给一线</small></div><div class="panel tag-summary"><div class="tag-summary-head"><b>产品映射规则</b><span class="status-pill orange">需审核口径</span></div><strong>'+rules.length+'</strong><small>规则变更应记录操作人和生效时间</small></div></div>'+
      '<div class="rule-note"><b>职责拆分建议：</b>“标签字典”负责标签名、来源字段、类型和可选值；“产品映射规则”负责标签如何组合命中哪个产品、优先级和启停。新增上游物理字段仍需要数据开发接入，不能只在这里新建标签。</div>'+

  function renderTagTable(){
    if(tagTab==="dictionary"){
      return '<div class="list-toolbar"><div class="list-heading">标签清单 <span class="selected-hint">配置变更会影响后续筛选项</span></div><button class="btn btn-primary btn-small" id="addTagBtn2">＋ 新增标签</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>标签编码</th><th>标签名称</th><th>标签类别</th><th>上游来源字段</th><th>类型</th><th>可选值</th><th>状态</th><th>说明</th><th>操作</th></tr></thead><tbody>'+tags.map(function(t){return '<tr><td>'+esc(t.id)+'</td><td><b>'+esc(t.name)+'</b></td><td>'+esc(t.category)+'</td><td><code>'+esc(t.source)+'</code></td><td>'+esc(t.type)+'</td><td><div class="tag-value-list">'+t.values.map(function(v){return '<span class="tag-value">'+esc(v)+'</span>';}).join("")+'</div></td><td><span class="status-pill '+(t.status==="启用"?"green":"")+'">'+esc(t.status)+'</span></td><td>'+esc(t.note)+'</td><td><button class="link" data-edit-tag="'+esc(t.id)+'">编辑</button> <button class="link" data-toggle-tag="'+esc(t.id)+'">'+(t.status==="启用"?"停用":"启用")+'</button></td></tr>';}).join("")+'</tbody></table></div><div class="pagination"><span>共 '+tags.length+' 个标签；建议标签编码稳定、名称可调整，避免直接改动底层字段含义。</span><span>数据样例</span></div>';

  }
  function bindTags(){
    document.querySelectorAll("[data-action=go-audience]").forEach(function(b){b.onclick=function(){navTo("audience");};});
    document.querySelectorAll("[data-tag-tab]").forEach(function(b){b.onclick=function(){tagTab=b.getAttribute("data-tag-tab");renderView();};});
    ["addTagBtn","addTagBtn2"].forEach(function(id){var b=document.getElementById(id);if(b)b.onclick=function(){openTagModal(null);};});
    var addRule=document.getElementById("addRuleBtn");if(addRule)addRule.onclick=function(){openRuleModal(null);};
    document.querySelectorAll("[data-edit-tag]").forEach(function(b){b.onclick=function(){openTagModal(b.getAttribute("data-edit-tag"));};});
    document.querySelectorAll("[data-toggle-tag]").forEach(function(b){b.onclick=function(){var t=tags.find(function(x){return x.id===b.getAttribute("data-toggle-tag");});if(!t)return;t.status=t.status==="启用"?"停用":"启用";renderView();toast("标签状态已更新："+t.name+" / "+t.status);};});
    document.querySelectorAll("[data-edit-rule]").forEach(function(b){b.onclick=function(){openRuleModal(b.getAttribute("data-edit-rule"));};});
    document.querySelectorAll("[data-toggle-rule]").forEach(function(b){b.onclick=function(){var r=rules.find(function(x){return x.id===b.getAttribute("data-toggle-rule");});if(!r)return;r.status=r.status==="启用"?"停用":"启用";renderView();toast("映射规则状态已更新："+r.id);};});
  }
  function openTagModal(id){
    var item=id?tags.find(function(t){return t.id===id;}):null;
    var body='<div class="form-grid">'+
      '<div class="field"><label>标签名称 *</label><input id="tagName" class="control" value="'+esc(item?item.name:"")+'" placeholder="例如：高频维修"></div>'+
      '<div class="field"><label>标签类别 *</label><input id="tagCategory" class="control" value="'+esc(item?item.category:"房屋状态")+'" placeholder="例如：装修意向"></div>'+
      '<div class="field full"><label>上游来源字段 *</label><input id="tagSource" class="control" value="'+esc(item?item.source:"house_tag_snapshot.new_tag_field")+'" placeholder="表名.字段名"></div>'+
      '<div class="field"><label>数据类型</label><select id="tagType" class="control"><option '+(item&&item.type==="布尔"?"selected":"")+' >布尔</option><option '+(item&&item.type==="枚举"?"selected":"")+' >枚举</option><option '+(item&&item.type==="数值"?"selected":"")+' >数值</option><option '+(item&&item.type==="文本"?"selected":"")+' >文本</option></select></div>'+
      '<div class="field"><label>标签状态</label><select id="tagStatus" class="control"><option '+(!item||item.status==="启用"?"selected":"")+'>启用</option><option '+(item&&item.status==="停用"?"selected":"")+'>停用</option></select></div>'+
      '<div class="field full"><label>可选值（用中文逗号分隔）</label><input id="tagValues" class="control" value="'+esc(item?item.values.join("，"):"是，否")+'" placeholder="是，否"></div>'+
      '<div class="field full"><label>业务说明</label><textarea id="tagNote" class="textarea" style="min-height:65px">'+esc(item?item.note:"说明这个标签的业务定义、来源口径和使用注意事项。")+'</textarea></div></div>';
    modal(item?"编辑标签":"新增标签","标签字典决定筛选页可以选择哪些标签，不直接修改源数据。",body,'<span class="foot-hint">新增上游物理字段时，还需要同步补充数据抽取与字段映射。</span><div><button class="btn" data-close-modal>取消</button> <button class="btn btn-primary" id="saveTag">保存标签</button></div>');
    document.getElementById("saveTag").onclick=function(){
      var name=document.getElementById("tagName").value.trim(),category=document.getElementById("tagCategory").value.trim(),source=document.getElementById("tagSource").value.trim();
      if(!name||!category||!source){toast("标签名称、类别和来源字段为必填项");return;}
      var values=document.getElementById("tagValues").value.split(/[，,]/).map(function(x){return x.trim();}).filter(Boolean);
      var obj={id:item?item.id:"T"+String(Date.now()).slice(-6),name:name,category:category,source:source,type:document.getElementById("tagType").value,values:values,status:document.getElementById("tagStatus").value,note:document.getElementById("tagNote").value.trim()};
      if(item){Object.assign(item,obj);}else{tags.push(obj);}
      closeModal();renderView();toast(item?"标签已更新":"新标签已添加到演示字典");
    };
  }
  function openRuleModal(id){
    var item=id?rules.find(function(r){return r.id===id;}):null;
    var body='<div class="form-grid"><div class="field"><label>命中产品 *</label><select id="ruleProduct" class="control">'+products.map(function(p){return '<option '+(item&&item.product===p?"selected":"")+'>'+esc(p)+'</option>';}).join("")+'</select></div>'+
      '<div class="field"><label>优先级 *</label><input id="rulePriority" type="number" min="1" class="control" value="'+esc(item?item.priority:(rules.length+1)*10)+'"></div>'+
      '<div class="field full"><label>匹配标签（可多选）</label><div class="channel-row" id="ruleTagOptions">'+tags.map(function(t){return '<label class="channel-option"><input type="checkbox" name="ruleTag" value="'+esc(t.name)+'" '+(item&&item.required.indexOf(t.name)>=0?'checked':'')+'> '+esc(t.name)+'</label>';}).join("")+'</div></div>'+
      '<div class="field"><label>组合逻辑</label><select id="ruleLogic" class="control"><option '+(item&&item.logic==="命中任一条件"?"selected":"")+'>命中任一条件</option><option '+(!item||item.logic==="必选条件全部满足"?"selected":"")+'>必选条件全部满足</option><option '+(item&&item.logic==="必选 + 组合条件"?"selected":"")+'>必选 + 组合条件</option></select></div>'+
      '<div class="field"><label>规则状态</label><select id="ruleStatus" class="control"><option '+(!item||item.status==="启用"?"selected":"")+'>启用</option><option '+(item&&item.status==="停用"?"selected":"")+'>停用</option></select></div></div>'+
      '<div class="rule-note" style="margin-top:12px">本 Demo 仅展示配置交互，不执行生产规则引擎。正式环境应对规则语法、字段合法性、互斥产品和规则优先级进行校验，并记录审计日志。</div>';
    modal(item?"编辑产品映射规则":"新增产品映射规则","维护标签如何映射到产品；命中结果需与后端规则引擎保持一致。",body,'<span class="foot-hint">优先级数值越小，优先级越高。</span><div><button class="btn" data-close-modal>取消</button> <button class="btn btn-primary" id="saveRule">保存规则</button></div>');
    document.getElementById("saveRule").onclick=function(){
      var required=Array.from(document.querySelectorAll('input[name="ruleTag"]:checked')).map(function(x){return x.value;});
      var priority=parseInt(document.getElementById("rulePriority").value,10);
      if(!required.length){toast("至少选择一个匹配标签");return;}if(!priority||priority<1){toast("请输入大于 0 的优先级");return;}
      var obj={id:item?item.id:"R"+String(Date.now()).slice(-6),product:document.getElementById("ruleProduct").value,required:required,logic:document.getElementById("ruleLogic").value,priority:priority,status:document.getElementById("ruleStatus").value,updated:new Date().toISOString().slice(0,10)};
      if(item)Object.assign(item,obj);else rules.push(obj);
      closeModal();tagTab="mapping";renderView();toast(item?"映射规则已更新":"新增映射规则已保存");
    };
  }
  function recordsView(){
    return '<div class="page-head"><div><h1 class="page-title">推送人群包记录</h1><p class="page-desc">每次推送形成独立批次，记录发起人、发送时间、海报与文案、目标人数及房屋明细，支持事后复盘。</p></div><div class="head-actions"><button class="btn" data-action="go-audience">← 返回潜客挖掘</button></div></div>'+
      '<div class="metrics"><div class="metric"><span class="metric-icon">▤</span><div><div class="metric-label">推送批次</div><div class="metric-value">'+pushRecords.length+'</div><div class="metric-sub">保留每次操作快照</div></div></div><div class="metric"><span class="metric-icon">◉</span><div><div class="metric-label">覆盖房屋（批次累计）</div><div class="metric-value">'+pushRecords.reduce(function(a,r){return a+r.count;},0)+'</div><div class="metric-sub">同一房屋可能出现在多批次</div></div></div><div class="metric"><span class="metric-icon">▧</span><div><div class="metric-label">包含海报</div><div class="metric-value">'+pushRecords.filter(function(r){return r.posterData||r.posterName&&r.posterName!=="未上传海报";}).length+'</div><div class="metric-sub">留存素材名称及预览（Demo）</div></div></div><div class="metric"><span class="metric-icon">✓</span><div><div class="metric-label">模拟完成</div><div class="metric-value">'+pushRecords.filter(function(r){return r.status==="模拟完成"||r.status==="演示成功";}).length+'</div><div class="metric-sub">不是实际通道送达结果</div></div></div></div>'+
      '<section class="panel list-panel"><div class="list-toolbar"><div class="list-heading">推送批次明细</div><input id="recordSearch" class="control" style="width:220px" placeholder="搜索批次 / 人群包 / 推送人"><button class="btn btn-small" id="recordSearchClear">清空</button></div>'+
      '<div class="table-wrap"><table class="data-table"><thead><tr><th>推送批次号</th><th>人群包名称</th><th>推送发起人</th><th>发起时间</th><th>触达渠道</th><th>房屋数量</th><th>海报</th><th>文案摘要</th><th>状态</th><th>操作</th></tr></thead><tbody id="recordRows">'+recordRows(pushRecords)+'</tbody></table></div>'+
      '<div class="pagination"><span>共 '+pushRecords.length+' 条推送批次。人群包明细为发起时快照，不随底账后续更新而变化。</span><span>演示数据</span></div></section>'+
      '<div class="rule-note">正式系统建议持久化保存 package_id、push_batch_id、sender_id、copywriting_snapshot、poster_object_key、channel、每套房屋快照、触达回执和失败原因。当前 Demo 只在本次浏览器会话中保存，刷新页面会重置为样例数据。</div>';
  }
  function recordRows(list){
    if(!list.length)return '<tr><td colspan="10"><div class="empty-state"><div class="empty-icon">▤</div>暂时没有符合条件的推送记录。</div></td></tr>';
    return list.map(function(r){return '<tr><td><b>'+esc(r.id)+'</b></td><td>'+esc(r.packageName)+'</td><td>'+esc(r.sender)+'</td><td>'+esc(r.createdAt)+'</td><td>'+r.channels.map(function(c){return '<span class="tag-mini">'+esc(c)+'</span>';}).join("")+'</td><td>'+r.count+' 套</td><td>'+esc(r.posterName||"未上传")+'</td><td style="max-width:230px" title="'+esc(r.content)+'">'+esc(r.content)+'</td><td><span class="status-pill '+(r.status==="模拟完成"||r.status==="演示成功"?"green":"orange")+'">'+esc(r.status)+'</span></td><td><button class="link" data-record-detail="'+esc(r.id)+'">查看明细</button></td></tr>';}).join("");
  }
  function bindRecords(){
    document.querySelectorAll("[data-action=go-audience]").forEach(function(b){b.onclick=function(){navTo("audience");};});
    var search=document.getElementById("recordSearch");
    search.addEventListener("input",function(){var key=search.value.trim().toLowerCase();var list=pushRecords.filter(function(r){return [r.id,r.packageName,r.sender].join(" ").toLowerCase().indexOf(key)>=0;});document.getElementById("recordRows").innerHTML=recordRows(list);bindRecordButtons();});
    document.getElementById("recordSearchClear").onclick=function(){search.value="";search.dispatchEvent(new Event("input"));};
    bindRecordButtons();
  }
  function bindRecordButtons(){
    document.querySelectorAll("[data-record-detail]").forEach(function(b){b.onclick=function(){var r=pushRecords.find(function(x){return x.id===b.getAttribute("data-record-detail");});if(r)showRecordDetail(r);};});
  }
  function showRecordDetail(r){
    var items=r.houseIds.map(houseById).filter(Boolean);
    var body='<div class="detail-block"><h4>批次信息</h4><div class="detail-grid">'+
      detailField("推送批次号",r.id)+detailField("人群包名称",r.packageName)+detailField("推送发起人",r.sender)+detailField("发起时间",r.createdAt)+detailField("触达渠道",r.channels.join("、"))+detailField("目标房屋数",r.count+" 套")+
      detailField("批次状态",r.status)+detailField("海报文件",r.posterName||"未上传")+'</div></div>'+
      '<div class="detail-block"><h4>推送内容快照</h4><div style="padding:12px"><div style="font-size:10px;color:#8b98a6;margin-bottom:6px">发送文案</div><div style="white-space:pre-wrap;line-height:1.8;color:#40576d;font-size:11px">'+esc(r.content)+'</div><div style="font-size:10px;color:#8b98a6;margin:12px 0 6px">人群包规则 / 来源</div><div style="white-space:pre-wrap;line-height:1.8;color:#526a80;font-size:10.5px">'+esc(r.criteria||"未填写")+'</div>'+(r.posterData?'<div style="margin-top:12px"><div style="font-size:10px;color:#8b98a6;margin-bottom:6px">海报预览</div><img class="poster-thumb" src="'+r.posterData+'" alt="推送海报"></div>':'')+'</div></div>'+
      '<div class="detail-block"><h4>人群包明细（发起时快照） · '+items.length+' 套房屋</h4><div class="table-wrap"><table class="data-table"><thead><tr><th>房屋编码</th><th>房源名称</th><th>业主</th><th>脱敏手机号</th><th>命中产品</th><th>标签</th></tr></thead><tbody>'+items.map(function(h){return '<tr><td>'+esc(h.id.toUpperCase())+'</td><td>'+esc(h.house)+'</td><td>'+esc(h.owner)+'</td><td>'+esc(h.mobile)+'</td><td>'+esc(h.product)+'</td><td>'+h.labels.map(function(t){return '<span class="tag-mini">'+esc(t)+'</span>';}).join("")+'</td></tr>';}).join("")+'</tbody></table></div></div>'+
      '<div class="rule-note">'+esc(r.detail||"记录已生成。正式环境应另行保存每个号码的发送状态、外部渠道消息 ID、失败原因和回执时间。")+'</div>';
    modal("推送批次详情","查看推送人、推送内容与对应的人群包房屋明细。",body,'<span class="foot-hint">真实发送状态应以外部通道回执为准。</span><button class="btn btn-primary" data-close-modal>关闭详情</button>',true);
  }
  function packagesView(){
    return '<div class="page-head"><div><h1 class="page-title">已保存人群包</h1><p class="page-desc">保存后的房屋列表作为固定快照，可以查看明细、重新推送；每次实际操作都会生成单独推送批次。</p></div><div class="head-actions"><button class="btn" data-action="go-audience">← 返回潜客挖掘</button><button class="btn" data-action="go-records">查看推送记录</button></div></div>'+
      '<section class="panel saved-packages"><div class="list-heading">人群包清单</div><div class="saved-package-list" style="margin-top:13px">'+packageCards(audiencePackages.slice().reverse())+'</div></section>'+
      '<div class="rule-note">人群包保存的是某个时间点的房屋明细快照。重新推送前建议再次进行退订、黑名单、频控和线索静默校验；真实推送不能直接复用过期的联系方式状态。</div>';
  }
  function bindPackages(){
    document.querySelectorAll("[data-action=go-audience]").forEach(function(b){b.onclick=function(){navTo("audience");};});
    document.querySelectorAll("[data-action=go-records]").forEach(function(b){b.onclick=function(){navTo("records");};});
    bindPackageCards();
  }
  function showPackageDetail(p){
    var items=p.houseIds.map(houseById).filter(Boolean);
    var body='<div class="detail-block"><h4>人群包信息</h4><div class="detail-grid">'+detailField("人群包名称",p.name)+detailField("创建人",p.creator)+detailField("创建时间",p.createdAt)+detailField("房屋数量",items.length+" 套")+detailField("人群包编号",p.id)+detailField("快照类型","房屋明细快照")+'</div></div>'+
      '<div class="detail-block"><h4>保存的筛选规则</h4><div style="padding:12px;font-size:10.5px;line-height:1.8;color:#536a80">'+esc(p.criteria||"未填写")+'</div></div>'+
      '<div class="detail-block"><h4>人群包房屋明细</h4><div class="table-wrap"><table class="data-table"><thead><tr><th>房屋</th><th>业主</th><th>脱敏手机号</th><th>标签</th><th>产品</th></tr></thead><tbody>'+items.map(function(h){return '<tr><td>'+esc(h.house)+'</td><td>'+esc(h.owner)+'</td><td>'+esc(h.mobile)+'</td><td>'+h.labels.map(function(t){return '<span class="tag-mini">'+esc(t)+'</span>';}).join("")+'</td><td>'+esc(h.product)+'</td></tr>';}).join("")+'</tbody></table></div></div>';
    modal("人群包详情","已保存的人群包是当前浏览器会话中保存的演示快照。",body,'<span class="foot-hint">从人群包再次推送时仍会重新生成一条批次记录。</span><div><button class="btn" data-close-modal>关闭</button><button class="btn btn-primary" id="pushSavedPackage">配置推送</button></div>',true);
    document.getElementById("pushSavedPackage").onclick=function(){closeModal();openPushModal(items,p);};
  }
  function renderViewStats(){
    var tagsCount=document.getElementById("metricTags");if(tagsCount)tagsCount.textContent=tags.filter(function(t){return t.status==="启用";}).length;
    var packageCount=document.getElementById("metricPackages");if(packageCount)packageCount.textContent=audiencePackages.length;
    var recordsCount=document.getElementById("metricRecords");if(recordsCount)recordsCount.textContent=pushRecords.length;
  }
  function updatePackageStrip(){
    var panel=document.getElementById("savedPackagePanel"),list=document.getElementById("savedPackageList");
    if(panel&&list){panel.style.display=audiencePackages.length?"":"none";list.innerHTML=packageCards(audiencePackages.slice(-3).reverse());bindPackageCards();}
    renderViewStats();
  }

  document.querySelectorAll(".nav-item[data-view]").forEach(function(button){button.addEventListener("click",function(){navTo(button.getAttribute("data-view"));});});
  renderView();
  window.__marketingPushDemo={version:"1.0-demo",get tags(){return tags;},get rules(){return rules;},get packages(){return audiencePackages;},get records(){return pushRecords;}};
})();
</script>
</body>
</html>
